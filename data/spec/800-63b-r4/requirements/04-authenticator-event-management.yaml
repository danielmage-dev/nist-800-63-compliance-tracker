    textHash: 739a7317fd0e
    source: prose
    seededBy: parser
    verified: false
  4.2.3-R1:
    id: 4.2.3-R1
    rev: 800-63b-r4
    sectionNumber: 4.2.3
    ordinal: 1
    level: SHALL
    text: In all cases, account recovery SHALL cause a notification to be sent to the subscriber or
      their designee, as described in Sec. 4.6.
    textHash: ac91b026b4d5
    source: prose
    seededBy: parser
    verified: false
  4.3-R1:
    id: 4.3-R1
    rev: 800-63b-r4
    sectionNumber: "4.3"
    ordinal: 1
    level: SHALL
    text: The CSP SHALL suspend, invalidate, or destroy compromised authenticators from the subscriber’s
      account promptly following compromise detection. Organizations SHOULD establish time limits
      for this process.
    textHash: b56d7a1566f2
    source: prose
    seededBy: parser
    verified: false
  4.3-R2:
    id: 4.3-R2
    rev: 800-63b-r4
    sectionNumber: "4.3"
    ordinal: 2
    level: SHALL
    text: To facilitate the secure reporting of an authenticator’s loss, theft, damage, or compromise,
