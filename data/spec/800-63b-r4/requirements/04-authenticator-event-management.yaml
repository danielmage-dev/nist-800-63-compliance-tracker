requirements:
  4.1-R1:
    id: 4.1-R1
    rev: 800-63b-r4
    sectionNumber: "4.1"
    ordinal: 1
    level: SHALL
    text: Being issued by the CSP as part of enrollment or
    textHash: abfdc888fecc
    context: "Authenticators SHALL be bound to subscriber accounts by either:"
    source: prose
    seededBy: parser
    verified: false
  4.1-R2:
    id: 4.1-R2
    rev: 800-63b-r4
    sectionNumber: "4.1"
    ordinal: 2
    level: SHALL
    text: Using a subscriber-provided authenticator that is acceptable to the CSP.
    textHash: 392552bbbb4c
    context: "Authenticators SHALL be bound to subscriber accounts by either:"
    source: prose
    seededBy: parser
    verified: false
  4.1-R3:
    id: 4.1-R3
    rev: 800-63b-r4
    sectionNumber: "4.1"
    ordinal: 3
    level: SHALL
    text: Throughout the lifetime of a digital identity, CSPs SHALL maintain a record of all
      authenticators that are bound to each subscriber account. The CSP SHALL determine the
      characteristics of the authenticator being bound (e.g., single-factor versus multi-factor,
      phishing-resistant or not) so that verifiers can assess compliance with the requirements at
      each AAL. This determination MAY be based on strong evidence (e.g., authenticator
      attestation), direct information from having issued the authenticator, or typical
      characteristics of authenticator implementations (e.g., whether a user verification bit is set
      by [WebAuthn]).
    textHash: 8ad7724215c2
    source: prose
    seededBy: parser
    verified: false
  4.1-R4:
    id: 4.1-R4
    rev: 800-63b-r4
    sectionNumber: "4.1"
    ordinal: 4
    level: SHALL
    text: The CSP SHALL also maintain other state information that is required to meet the authenticator
      verification requirements. For example, the throttling of authentication attempts described in
      Sec. 3.2.2 requires the CSP or verifier to maintain state information on recent failed
      authentication attempts, except for activation factors verified at the authenticator.
    textHash: 6228f3c9f923
    source: prose
    seededBy: parser
    verified: false
  4.1-R5:
    id: 4.1-R5
    rev: 800-63b-r4
    sectionNumber: "4.1"
    ordinal: 5
    level: SHALL
    text: The record created by the CSP SHALL contain the date and time of significant authenticator
      life cycle events (e.g., binding to the subscriber account, renewal, update, expiration). The
      record SHOULD include information about the source of the binding (e.g., IP address, device
      identifier) of any device associated with the event.
    textHash: 4a551c6a6988
    source: prose
    seededBy: parser
    verified: false
  4.1-R6:
    id: 4.1-R6
    rev: 800-63b-r4
    sectionNumber: "4.1"
    ordinal: 6
    level: MAY
    text: As part of the binding process, the CSP MAY require additional information about the new
      authenticator or its associated endpoint to determine whether it is suitable for the requested
      AAL.
    textHash: f958728f9ba1
    source: prose
    seededBy: parser
    verified: false
  4.1.2.1-R1:
    id: 4.1.2.1-R1
    rev: 800-63b-r4
    sectionNumber: 4.1.2.1
    ordinal: 1
    level: SHOULD
    text: To minimize the need for account recovery, CSPs and verifiers SHOULD encourage subscribers to
      maintain at least two separate means of authentication. For example, a subscriber who usually
      uses an OTP authenticator as a physical authenticator MAY also be issued look-up secret
      authenticators or register a device for out-of-band authentication to be used if the physical
      authenticator is lost, stolen, or damaged. See Sec. 4.2 for more information on replacing
      passwords.
    textHash: 5c062c762e14
    source: prose
    seededBy: parser
    verified: false
  4.1.2.1-R2:
    id: 4.1.2.1-R2
    rev: 800-63b-r4
    sectionNumber: 4.1.2.1
    ordinal: 2
    level: SHALL
    text: Accordingly, CSPs SHALL permit the binding of multiple authenticators to a subscriber account.
      When any new authenticator is bound to a subscriber account, the CSP SHALL ensure that the
      process requires authentication at either the maximum AAL currently available in the
      subscriber account or the maximum AAL at which the new authenticator will be used, whichever
      is lower. For example, binding an authenticator that is suitable for use at AAL2 requires
      authentication at AAL2 unless the subscriber account currently has only AAL1 authentication
      capabilities. When an authenticator is added, the CSP SHALL notify the subscriber via a
      mechanism independent of the transaction binding the new authenticator, as described in Sec.
      4.6.
    textHash: e99bbf48ee32
    source: prose
    seededBy: parser
    verified: false
  4.1.2.2-R1:
    id: 4.1.2.2-R1
    rev: 800-63b-r4
    sectionNumber: 4.1.2.2
    ordinal: 1
    level: SHALL
    text: An endpoint that has authenticated to the CSP requests a binding code from the CSP. The
      binding code is input into the endpoint associated with the new authenticator and sent to the
      CSP.
    textHash: 8c485c62d431
    context: "The binding process SHALL proceed in one of the following ways:"
    source: prose
    seededBy: parser
    verified: false
  4.1.2.2-R2:
    id: 4.1.2.2-R2
    rev: 800-63b-r4
    sectionNumber: 4.1.2.2
    ordinal: 2
    level: SHALL
    text: The endpoint associated with the new authenticator obtains a binding code from the CSP. The
      binding code is input to an authenticated endpoint and sent to the CSP.
    textHash: 8b7fd29e988d
    context: "The binding process SHALL proceed in one of the following ways:"
    source: prose
    seededBy: parser
    verified: false
  4.1.2.2-R3:
    id: 4.1.2.2-R3
    rev: 800-63b-r4
    sectionNumber: 4.1.2.2
    ordinal: 3
    level: SHALL
    text: An authenticated protected channel SHALL be established by the endpoint associated with the
      new authenticator and the CSP.
    textHash: 388689de925d
    context: "In addition to the requirements in Sec. 4.1.2.1 and Sec. 4.2, the following requirements
      SHALL apply when binding an external authenticator:"
    source: prose
    seededBy: parser
    verified: false
  4.1.2.2-R4:
    id: 4.1.2.2-R4
    rev: 800-63b-r4
    sectionNumber: 4.1.2.2
    ordinal: 4
    level: MAY
    text: The subscriber MAY be prompted to enter an identifier by which the CSP knows them on the
      endpoint associated with the new authenticator.
    textHash: 546c0ae02903
    context: "In addition to the requirements in Sec. 4.1.2.1 and Sec. 4.2, the following requirements
      SHALL apply when binding an external authenticator:"
    source: prose
    seededBy: parser
    verified: false
  4.1.2.2-R5:
    id: 4.1.2.2-R5
    rev: 800-63b-r4
    sectionNumber: 4.1.2.2
    ordinal: 5
    level: SHALL
    text: The CSP SHALL generate a binding code using an approved random bit generator, as described in
      Sec. 3.2.12 and send it to either the new authenticator endpoint or the authenticated endpoint
      approving the binding. The binding code SHALL be at least 40 bits in length if it is used with
      an identifier that was entered in the previous step. Otherwise, a binding code of at least 112
      bits in length SHALL be required.
    textHash: b805f50a7414
    context: "In addition to the requirements in Sec. 4.1.2.1 and Sec. 4.2, the following requirements
      SHALL apply when binding an external authenticator:"
    source: prose
    seededBy: parser
    verified: false
  4.1.2.2-R6:
    id: 4.1.2.2-R6
    rev: 800-63b-r4
    sectionNumber: 4.1.2.2
    ordinal: 6
    level: SHALL_NOT
    text: The subscriber SHALL transfer the binding code to the other endpoint. This transfer SHALL
      either be manual or via a local out-of-band method (e.g., QR code). The binding code SHALL NOT
      be communicated over any insecure channel (e.g., email).
    textHash: b0965d0e22b4
    context: "In addition to the requirements in Sec. 4.1.2.1 and Sec. 4.2, the following requirements
      SHALL apply when binding an external authenticator:"
    source: prose
    seededBy: parser
    verified: false
  4.1.2.2-R7:
    id: 4.1.2.2-R7
    rev: 800-63b-r4
    sectionNumber: 4.1.2.2
    ordinal: 7
    level: SHALL
    text: The binding code SHALL be usable only once and SHALL be valid for a maximum of 10 minutes.
    textHash: 40f0d67541cb
    context: "In addition to the requirements in Sec. 4.1.2.1 and Sec. 4.2, the following requirements
      SHALL apply when binding an external authenticator:"
    source: prose
    seededBy: parser
    verified: false
  4.1.2.2-R8:
    id: 4.1.2.2-R8
    rev: 800-63b-r4
    sectionNumber: 4.1.2.2
    ordinal: 8
    level: SHOULD
    text: Following the binding of the new authenticator (or issuance of a certificate, in the case of
      PKI-based authenticators), the CSP SHOULD encourage the subscriber to authenticate with the
      new authenticator to confirm that the process has been completed successfully.
    textHash: 7d7d27dd7f4e
    context: "In addition to the requirements in Sec. 4.1.2.1 and Sec. 4.2, the following requirements
      SHALL apply when binding an external authenticator:"
    source: prose
    seededBy: parser
    verified: false
  4.1.2.2-R9:
    id: 4.1.2.2-R9
    rev: 800-63b-r4
    sectionNumber: 4.1.2.2
    ordinal: 9
    level: SHALL
    text: The CSP SHALL provide clear instructions on what the subscriber should do in the event of an
      authenticator binding mishap (e.g., making a button available to be pressed or a contact
      address to be used to allow a misbound authenticator to be quickly invalidated), as
      appropriate. This MAY be provided in the authenticated session in addition to the binding
      notification described in Sec. 4.6.
    textHash: e869190e88ca
    context: "In addition to the requirements in Sec. 4.1.2.1 and Sec. 4.2, the following requirements
      SHALL apply when binding an external authenticator:"
    source: prose
    seededBy: parser
    verified: false
  4.1.3-R1:
    id: 4.1.3-R1
    rev: 800-63b-r4
    sectionNumber: 4.1.3
    ordinal: 1
    level: SHALL
    text: CSPs SHOULD, where practical, accommodate subscriber-provided authenticators to relieve the
      burden on the subscriber of managing many authenticators. The binding of these authenticators
      SHALL be done as described in Sec. 4.1.2.
    textHash: 16a3c64143b2
    source: prose
    seededBy: parser
    verified: false
  4.1.3-R2:
    id: 4.1.3-R2
    rev: 800-63b-r4
    sectionNumber: 4.1.3
    ordinal: 2
    level: SHALL
    text: As part of this process, CSPs will need to establish the capabilities and characteristics of
      the subscriber-provided authenticator that they wish to accept to determine its suitability
      for the use case and the intended AAL. The level of assurance that the CSP requires in the
      fidelity of these authenticator attributes MAY vary depending on the use case and threat
      environment. Some authenticators, such as those based on the WebAuthn standard [WebAuthn],
      provide metadata about the authenticator during the binding or authentication process that can
      be used by the CSP to inform its decisions. This metadata, for example, could indicate whether
      an authenticator uses an activation factor to function as a multi-factor authenticator.
      Similarly, some subscriber-controlled wallets will also offer metadata about its functions,
      including information about the mechanisms used to unlock the wallet. CSPs SHOULD consider
      this metadata when choosing how to support a subscriber-provided authenticator. In many cases,
      such information will not be available, and CSPs SHOULD evaluate the characteristics of
      commercially available authenticators that are likely to be used by their subscribers and make
      determinations about what authenticators they will accept. The types of authenticators
      accepted by the CSP SHALL be documented in the CSP practice statement.
    textHash: 109d65baa0d5
    source: prose
    seededBy: parser
    verified: false
  4.1.3-R3:
    id: 4.1.3-R3
    rev: 800-63b-r4
    sectionNumber: 4.1.3
    ordinal: 3
    level: SHOULD_NOT
    text: In some high assurance use cases, CSPs may desire additional confidence in the attributes of
      the authenticators registered by their subscribers. Some authenticators support attestation
      features that can be used to determine the capabilities and manufacturers of specific
      authenticators. However, such attestation features are not widely available in authenticators
      that are likely to be used by public users. The lack of support for attestations SHOULD NOT
      block the use of authenticators for broad public-facing applications.
    textHash: 124935c8855e
    source: prose
    seededBy: parser
    verified: false
  4.1.4-R1:
    id: 4.1.4-R1
    rev: 800-63b-r4
    sectionNumber: 4.1.4
    ordinal: 1
    level: SHOULD
    text: The subscriber SHOULD bind a new or updated authenticator before an existing authenticator’s
      expiration. The process for this SHOULD conform closely to the binding process for an
      additional authenticator, as described in Sec. 4.1.2. The CSP MAY periodically take other
      actions (e.g., confirming contact addresses) as a part of the renewal process or separately.
      Following the successful use of the replacement authenticator, the CSP SHOULD invalidate the
      expiring authenticator.
    textHash: fc9f656482d7
    source: prose
    seededBy: parser
    verified: false
  4.2.1-R1:
    id: 4.2.1-R1
    rev: 800-63b-r4
    sectionNumber: 4.2.1
    ordinal: 1
    level: SHALL
    text: CSPs SHALL support one or more of these and MAY support an application-specific method (e.g.,
      interaction with a CSP agent) to recover a subscriber account. The use of alternative methods
      SHALL be based on a risk analysis and documented by the CSP.
    textHash: 909b94b7beb5
    source: prose
    seededBy: parser
    verified: false
  4.2.1.1-R1:
    id: 4.2.1.1-R1
    rev: 800-63b-r4
    sectionNumber: 4.2.1.1
    ordinal: 1
    level: SHALL
    text: At enrollment, a CSP that supports this recovery option SHOULD issue a recovery code to the
      subscriber. The recovery code SHALL include at least 64 bits from an approved random bit
      generator. The saved recovery code may be presented as numeric or a printable ASCII
      representation (e.g., Base64) for manual entry or as a machine-readable optical label (e.g.,
      QR code) that contains the recovery code. At any point following enrollment, the subscriber
      MAY request a replacement recovery code. The issuance of a replacement recovery code SHALL
      result in an account recovery notification, as described in Sec. 4.6.
    textHash: 2a8a1e21cb75
    source: prose
    seededBy: parser
    verified: false
  4.2.1.1-R2:
    id: 4.2.1.1-R2
    rev: 800-63b-r4
    sectionNumber: 4.2.1.1
    ordinal: 2
    level: SHALL
    text: Saved recovery codes are intended to be maintained offline (e.g., printed or written down) and
      stored securely by the subscriber for future use. The verification of saved recovery codes
      SHALL be subject to the throttling requirements in Sec. 3.2.2. Saved recovery codes SHALL be
      stored in the subscriber account in hashed form using an approved one-way function, as
      described in Sec. 3.1.1.2. Following the use of a saved recovery code, the CSP SHALL
      invalidate that recovery code and SHALL issue a new saved recovery code to the subscriber.
    textHash: 9a0c86053e56
    source: prose
    seededBy: parser
    verified: false
  4.2.1.2-R1:
    id: 4.2.1.2-R1
    rev: 800-63b-r4
    sectionNumber: 4.2.1.2
    ordinal: 1
    level: SHALL
    text: CSPs that support this option allow the subscriber to maintain one or more recovery addresses
      (e.g., postal, email, text message, voice). When recovery is required, a recovery code will be
      sent to a claimant-chosen address. The issued recovery code SHALL include at least six decimal
      digits (or equivalent) from an approved random bit generator, as described in Sec. 3.2.12. The
      issued recovery code may be presented as a numeric or a printable ASCII representation (e.g.,
      Base64) for manual entry, a secure (e.g., https) link with a representation of the recovery
      code, or a machine-readable optical label (e.g., QR code) that contains the recovery code.
    textHash: e646ff83a11b
    source: prose
    seededBy: parser
    verified: false
  4.2.1.2-R2:
    id: 4.2.1.2-R2
    rev: 800-63b-r4
    sectionNumber: 4.2.1.2
    ordinal: 2
    level: SHALL
    text: 21 days when sent to a postal address within the contiguous United States
    textHash: 5de433a6dadc
    context: "Issued recovery codes SHALL be valid for at most:"
    source: prose
    seededBy: parser
    verified: false
  4.2.1.2-R3:
    id: 4.2.1.2-R3
    rev: 800-63b-r4
    sectionNumber: 4.2.1.2
    ordinal: 3
    level: SHALL
    text: 30 days when sent to a postal address outside of the contiguous United States
    textHash: 56afdc0ac24a
    context: "Issued recovery codes SHALL be valid for at most:"
    source: prose
    seededBy: parser
    verified: false
  4.2.1.2-R4:
    id: 4.2.1.2-R4
    rev: 800-63b-r4
    sectionNumber: 4.2.1.2
    ordinal: 4
    level: SHALL
    text: 10 minutes when sent via text message or voice
    textHash: 2b4478fdf928
    context: "Issued recovery codes SHALL be valid for at most:"
    source: prose
    seededBy: parser
    verified: false
  4.2.1.2-R5:
    id: 4.2.1.2-R5
    rev: 800-63b-r4
    sectionNumber: 4.2.1.2
    ordinal: 5
    level: SHALL
    text: 24 hours when sent to an email address
    textHash: afe244b6b7bc
    context: "Issued recovery codes SHALL be valid for at most:"
    source: prose
    seededBy: parser
    verified: false
  4.2.1.2-R6:
    id: 4.2.1.2-R6
    rev: 800-63b-r4
    sectionNumber: 4.2.1.2
    ordinal: 6
    level: SHALL
    text: The verification of issued recovery codes SHALL be subject to the throttling requirements in
      Sec. 3.2.2.
    textHash: 96803fb738e9
    source: prose
    seededBy: parser
    verified: false
  4.2.1.2-R7:
    id: 4.2.1.2-R7
    rev: 800-63b-r4
    sectionNumber: 4.2.1.2
    ordinal: 7
    level: SHALL
    text: When establishing recovery addresses other than those validated or verified as part of the
      identity proofing process, the address SHALL be verified. To verify an address, the CSP SHALL
      send a confirmation code with the same characteristics as a recovery code to the newly
      established recovery address. A recovery address SHALL be established only after the
      subscriber provides the correct confirmation code to the CSP. CSPs SHALL allow the subscriber
      to establish at least two recovery addresses.
    textHash: 7eb1872fae08
    source: prose
    seededBy: parser
    verified: false
  4.2.1.3-R1:
    id: 4.2.1.3-R1
    rev: 800-63b-r4
    sectionNumber: 4.2.1.3
    ordinal: 1
    level: MAY
    text: The validity time for recovery codes sent to recovery contacts MAY be extended by 24 hours
      (e.g., valid for no more than 24 hours and 10 minutes if sent via text messaging) to provide
      additional time for the recovery contact to communicate the recovery code to the subscriber.
    textHash: abf2ce4beba0
    context: "CSPs that support the use of recovery contacts SHALL allow the subscriber to specify one
      or more addresses of trusted associates to receive issued recovery codes. The requirements for
      recovery contacts are very similar to those for issued recovery codes with the following
      exceptions:"
    source: prose
    seededBy: parser
    verified: false
  4.2.1.3-R2:
    id: 4.2.1.3-R2
    rev: 800-63b-r4
    sectionNumber: 4.2.1.3
    ordinal: 2
    level: MAY
    text: Confirmation of the recovery code address MAY also be extended by 24 hours to allow the
      recovery contact to send the confirmation code to the subscriber for entry.
    textHash: 389f3358f03c
    context: "CSPs that support the use of recovery contacts SHALL allow the subscriber to specify one
      or more addresses of trusted associates to receive issued recovery codes. The requirements for
      recovery contacts are very similar to those for issued recovery codes with the following
      exceptions:"
    source: prose
    seededBy: parser
    verified: false
  4.2.1.3-R3:
    id: 4.2.1.3-R3
    rev: 800-63b-r4
    sectionNumber: 4.2.1.3
    ordinal: 3
    level: SHALL
    text: If the CSP supports the use of recovery contacts, the CSP SHALL provide methods for
      subscribers to view and manage recovery contacts. CSPs SHOULD send a reminder annually to
      subscribers to review their list of recovery contacts.
    textHash: 8716a7845290
    source: prose
    seededBy: parser
    verified: false
  4.2.1.4-R1:
    id: 4.2.1.4-R1
    rev: 800-63b-r4
    sectionNumber: 4.2.1.4
    ordinal: 1
    level: SHALL
    text: When the subscriber account has been identity-proofed at a minimum of identity assurance level
      1 (IAL1), CSPs SHOULD support account recovery by repeating a portion of the identity proofing
      process. The CSP SHALL repeat the necessary steps of identity proofing consistent with the
      level of initial identity proofing and SHALL confirm that the claimant’s identity is
      consistent with the previously established account. If the CSP has retained a biometric sample
      from the user or a copy of the evidence used during the initial proofing that is of sufficient
      quality and resolution, the CSP MAY repeat only the verification portion of the identity
      proofing process, as described in [SP800-63A].
    textHash: 51d1f35630e3
    source: prose
    seededBy: parser
    verified: false
  4.2.2.1-R1:
    id: 4.2.2.1-R1
    rev: 800-63b-r4
    sectionNumber: 4.2.2.1
    ordinal: 1
    level: SHALL
    text: When subscribers have not been identity-proofed, a reproofing option is not available to
      support account recovery. The recovery of such subscriber accounts SHALL require the
      successful use of a saved recovery code, issued recovery code, or recovery contact.
    textHash: 7c0d0d4537bc
    source: prose
    seededBy: parser
    verified: false
  4.2.2.2-R1:
    id: 4.2.2.2-R1
    rev: 800-63b-r4
    sectionNumber: 4.2.2.2
    ordinal: 1
    level: SHALL
    text: Two recovery codes obtained using different methods from the set (i.e., saved, issued, and
      recovery contacts)
    textHash: e347efe54e3f
    context: "To recover an account that can authenticate at a maximum of AAL2, the CSP SHALL require
      the subscriber to complete one of the following:"
    source: prose
    seededBy: parser
    verified: false
  4.2.2.2-R2:
    id: 4.2.2.2-R2
    rev: 800-63b-r4
    sectionNumber: 4.2.2.2
    ordinal: 2
    level: SHALL
    text: One recovery code from the set (i.e., saved, issued, and recovery contacts) plus
      authentication with a single-factor authenticator that is bound to the subscriber account
    textHash: d632cb0ca1d4
    context: "To recover an account that can authenticate at a maximum of AAL2, the CSP SHALL require
      the subscriber to complete one of the following:"
    source: prose
    seededBy: parser
    verified: false
  4.2.2.2-R3:
    id: 4.2.2.2-R3
    rev: 800-63b-r4
    sectionNumber: 4.2.2.2
    ordinal: 3
    level: SHALL
    text: Repeated identity proofing (provided that the subscriber account has been identity-proofed)
    textHash: 172c590bb267
    context: "To recover an account that can authenticate at a maximum of AAL2, the CSP SHALL require
      the subscriber to complete one of the following:"
    source: prose
    seededBy: parser
    verified: false
  4.2.2.3-R1:
    id: 4.2.2.3-R1
    rev: 800-63b-r4
    sectionNumber: 4.2.2.3
    ordinal: 1
    level: SHALL
    text: If an account that can authenticate at AAL3 has been identity-proofed at IAL3, the CSP SHALL
      successfully perform a successful biometric comparison against the biometric characteristic
      collected during an initial on-site attended identity proofing session, as described in
      [SP800-63A]. The CSP MAY also require the presentation of the evidence used in the initial
