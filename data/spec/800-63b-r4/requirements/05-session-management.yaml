chapter: "5"
rev: 800-63b-r4
requirements:
  5-R1:
    id: 5-R1
    rev: 800-63b-r4
    sectionNumber: "5"
    ordinal: 1
    level: MAY
    text: To facilitate this behavior, a session MAY be started in response to an authentication event
      and continue until it is terminated. The session MAY be terminated for any number of reasons,
      including an inactivity timeout or an explicit logout event. The session MAY be extended
      through a reauthentication event (see Sec. 5.2) in which the subscriber repeats some of the
      initial authentication process or performs a full authentication, thereby reestablishing the
      authenticated session.
    textHash: 227bd1e04391
    source: prose
    seededBy: parser
    verified: false
  5.1-R1:
    id: 5.1-R1
    rev: 800-63b-r4
    sectionNumber: "5.1"
    ordinal: 1
    level: SHALL
    text: A session occurs between the software (i.e., the session subject) that a subscriber is running
      (e.g., browser, application, operating system) and the RP or CSP that the subscriber is
      accessing (i.e., the session host). A session secret SHALL be shared between the subscriber’s
      software and the accessed service. This secret binds the two ends of the session and allows
      the subscriber to continue using the service over time. The secret SHALL be directly presented
      by the subscriber’s software, or possession of the secret SHALL be proven using a
      cryptographic mechanism.
    textHash: 93c756dfad6c
    source: prose
    seededBy: parser
    verified: false
  5.1-R2:
    id: 5.1-R2
    rev: 800-63b-r4
    sectionNumber: "5.1"
    ordinal: 2
    level: SHALL
    text: A web browser session with a “session” cookie
    textHash: 3e0a97704c8a
    context: "The continuity of authenticated sessions SHALL be based on the possession of a session
      secret that is issued by the session host at the time of authentication and optionally
      refreshed during the session. The nature of a session depends on the application, such as:"
    source: prose
    seededBy: parser
    verified: false
  5.1-R3:
    id: 5.1-R3
    rev: 800-63b-r4
    sectionNumber: "5.1"
    ordinal: 3
    level: SHALL
    text: An instance of a mobile application that retains a session secret
    textHash: 8c7f05bae5cb
    context: "The continuity of authenticated sessions SHALL be based on the possession of a session
      secret that is issued by the session host at the time of authentication and optionally
      refreshed during the session. The nature of a session depends on the application, such as:"
    source: prose
    seededBy: parser
    verified: false
  5.1-R4:
    id: 5.1-R4
    rev: 800-63b-r4
    sectionNumber: "5.1"
    ordinal: 4
    level: SHALL_NOT
    text: Session secrets that are used as bearer tokens for session management SHOULD NOT be persistent
      (i.e., retained across a restart of the associated application or a reboot of the host device)
      because they are tied to specific sessions that a restart or reboot would end. Cookies and
      similar “remember my browser” features SHALL NOT be used instead of authentication except as
      provided for reauthentication at AAL2 in Sec. 2.2.3 when the inactivity limit has been
      exceeded but the time limit has not.
    textHash: 3eeb5b53a8af
    source: prose
    seededBy: parser
    verified: false
  5.1-R5:
    id: 5.1-R5
    rev: 800-63b-r4
    sectionNumber: "5.1"
    ordinal: 5
    level: SHALL
    text: Some technologies (e.g., the emerging device bound session credentials specification [DBSC])
      mitigate the risk of theft of session secrets by using cryptographic protocols that prove the
      possession of a session secret rather than using them as bearer tokens. These technologies
      might additionally store and use these session secrets in protected keystores to reduce the
      risk of exfiltration by malware. Session secrets used with such proof of possession techniques
      MAY persist. However, RPs and CSPs SHALL ensure that the session lifetime limits described in
      Sec. 2.2.3 are enforced even when a knowledge of the session secret is demonstrated.
    textHash: 126b37a67e74
    source: prose
    seededBy: parser
    verified: false
  5.1-R6:
    id: 5.1-R6
    rev: 800-63b-r4
    sectionNumber: "5.1"
    ordinal: 6
    level: SHALL_NOT
    text: The secret used for session binding SHALL be generated by the session host in direct response
      to an authentication event. A session SHOULD inherit the AAL properties of the authentication
      event that triggered its creation. A session MAY be considered at a lower AAL than the
      authentication event but SHALL NOT be considered at a higher AAL than the authentication
      event.
    textHash: 492c2571e985
    source: prose
    seededBy: parser
    verified: false
  5.1-R7:
    id: 5.1-R7
    rev: 800-63b-r4
    sectionNumber: "5.1"
    ordinal: 7
    level: SHALL
    text: Secrets are established during or immediately following authentication.
    textHash: 55678ad2bbdb
    context: "The secrets used for session binding SHALL meet all of the following requirements:"
    source: prose
    seededBy: parser
    verified: false
  5.1-R8:
    id: 5.1-R8
    rev: 800-63b-r4
    sectionNumber: "5.1"
    ordinal: 8
    level: SHALL
    text: Secrets are established using input from an approved random bit generator, as described in
      Sec. 3.2.12, and are at least 64 bits in length.
    textHash: f13a043dc5c5
    context: "The secrets used for session binding SHALL meet all of the following requirements:"
    source: prose
    seededBy: parser
    verified: false
  5.1-R9:
    id: 5.1-R9
    rev: 800-63b-r4
    sectionNumber: "5.1"
    ordinal: 9
    level: SHALL
    text: Secrets are erased or invalidated by the session subject when the subscriber logs out.
    textHash: ff24a5c20c09
    context: "The secrets used for session binding SHALL meet all of the following requirements:"
    source: prose
    seededBy: parser
    verified: false
  5.1-R10:
    id: 5.1-R10
    rev: 800-63b-r4
    sectionNumber: "5.1"
    ordinal: 10
    level: SHALL
    text: Secrets are either transferred from the session host to the RP or CSP via an authenticated
      protected channel or derived from keys that are established as part of establishing a valid,
      mutually authenticated protected channel.
    textHash: 87ffc3de38db
    context: "The secrets used for session binding SHALL meet all of the following requirements:"
    source: prose
    seededBy: parser
    verified: false
  5.1-R11:
    id: 5.1-R11
    rev: 800-63b-r4
    sectionNumber: "5.1"
    ordinal: 11
    level: SHALL
    text: Secrets will time out and are not accepted after the times specified in Sec. 2.1.3, Sec.
      2.2.3, and Sec. 2.3.3, as appropriate for the AAL.
    textHash: 86b5f3374d39
    context: "The secrets used for session binding SHALL meet all of the following requirements:"
    source: prose
    seededBy: parser
    verified: false
  5.1-R12:
    id: 5.1-R12
    rev: 800-63b-r4
    sectionNumber: "5.1"
    ordinal: 12
    level: SHALL
    text: Secrets are unavailable to intermediaries between the host and the subscriber’s endpoint.
    textHash: 26d05d9b880a
    context: "The secrets used for session binding SHALL meet all of the following requirements:"
    source: prose
    seededBy: parser
    verified: false
  5.1-R13:
    id: 5.1-R13
    rev: 800-63b-r4
    sectionNumber: "5.1"
    ordinal: 13
    level: SHOULD_NOT
    text: In addition, the secrets used for session binding SHOULD be erased on the subscriber endpoint
      when they log out or when the secret is deemed to have expired. They SHOULD NOT be placed in
      insecure locations (e.g., HTML5 Local Storage) due to the potential exposure of local storage
      to cross-site scripting (XSS) attacks.
    textHash: 4d8c8eaffa35
    source: prose
    seededBy: parser
    verified: false
  5.1-R14:
    id: 5.1-R14
    rev: 800-63b-r4
    sectionNumber: "5.1"
    ordinal: 14
    level: SHALL_NOT
    text: Following authentication, authenticated sessions SHALL NOT fall back to an insecure transport
      (e.g., from https to http).
    textHash: 8f8689684bb7
    source: prose
    seededBy: parser
    verified: false
  5.1-R15:
    id: 5.1-R15
    rev: 800-63b-r4
    sectionNumber: "5.1"
    ordinal: 15
    level: SHALL
    text: POST/PUT content SHALL contain a session identifier that the RP SHALL verify to protect
      against cross-site request forgery (CSRF).
    textHash: 8c48daa1cdbc
    source: prose
    seededBy: parser
    verified: false
  5.1-R16:
    id: 5.1-R16
    rev: 800-63b-r4
    sectionNumber: "5.1"
    ordinal: 16
    level: SHOULD
    text: Sessions SHOULD provide a readily accessible mechanism for subscribers to terminate (i.e., log
      off) their session when their interaction is complete. Session logoff gives the subscriber
      additional confidence and control over the security of their session, particularly if the
      endpoint might be accessible to others.
    textHash: 43396e3c7fa3
    source: prose
    seededBy: parser
    verified: false
  5.1.1-R1:
    id: 5.1.1-R1
    rev: 800-63b-r4
    sectionNumber: 5.1.1
    ordinal: 1
    level: SHALL
    text: SHALL be tagged to be accessible only on secure (i.e., HTTPS) sessions.
    textHash: 54942dbaf8cb
    source: prose
    seededBy: parser
    verified: false
  5.1.1-R2:
    id: 5.1.1-R2
    rev: 800-63b-r4
    sectionNumber: 5.1.1
    ordinal: 2
    level: SHALL
    text: SHALL be accessible to the minimum practical hostnames and paths.
    textHash: bcc562fc5191
    source: prose
    seededBy: parser
    verified: false
  5.1.1-R3:
    id: 5.1.1-R3
    rev: 800-63b-r4
    sectionNumber: 5.1.1
    ordinal: 3
    level: SHOULD
    text: SHOULD be tagged as inaccessible via JavaScript (i.e., HttpOnly).
    textHash: 63c58267d516
    source: prose
    seededBy: parser
    verified: false
  5.1.1-R4:
    id: 5.1.1-R4
    rev: 800-63b-r4
    sectionNumber: 5.1.1
    ordinal: 4
    level: SHALL_NOT
    text: SHOULD be tagged to expire at or soon after the session’s validity period. This requirement is
      intended to limit the accumulation of cookies but SHALL NOT be relied upon to enforce session
      timeouts.
    textHash: ae0ddcdba655
    source: prose
    seededBy: parser
    verified: false
  5.1.1-R5:
    id: 5.1.1-R5
    rev: 800-63b-r4
    sectionNumber: 5.1.1
    ordinal: 5
    level: SHOULD
    text: SHOULD have the “__Host-“ prefix and set “Path=/”.
    textHash: 71f01a04a0d4
    source: prose
    seededBy: parser
    verified: false
  5.1.1-R6:
    id: 5.1.1-R6
    rev: 800-63b-r4
    sectionNumber: 5.1.1
    ordinal: 6
    level: SHOULD
    text: SHOULD set “SameSite=Lax” or “SameSite=Strict”.
    textHash: f651e9511b22
    source: prose
    seededBy: parser
    verified: false
  5.1.1-R7:
    id: 5.1.1-R7
    rev: 800-63b-r4
    sectionNumber: 5.1.1
    ordinal: 7
    level: SHALL_NOT
    text: SHOULD contain only an opaque string (e.g., a session identifier) and SHALL NOT contain
      cleartext personal information.
    textHash: ad2cd5b2b5dd
    source: prose
    seededBy: parser
    verified: false
  5.1.2-R1:
    id: 5.1.2-R1
    rev: 800-63b-r4
    sectionNumber: 5.1.2
    ordinal: 1
    level: SHALL_NOT
    text: An access token (e.g., OAuth [RFC6749]) is used to allow an application to access a set of
      services on a subscriber’s behalf following an authentication event. The RP SHALL NOT
      interpret the presence of an access token as an indicator of the subscriber’s presence in the
      absence of other signals. The access token and any associated refresh tokens could be valid
      long after the authentication session has ended and the subscriber has left the application.
    textHash: f2fdc7d60173
    source: prose
    seededBy: parser
    verified: false
  5.2-R1:
    id: 5.2-R1
    rev: 800-63b-r4
    sectionNumber: "5.2"
    ordinal: 1
    level: SHALL
    text: The periodic reauthentication of sessions SHALL be performed to confirm the subscriber’s
      continued presence at an authenticated session (e.g., that the subscriber has not walked away
      without logging out).
    textHash: f8567ff9463d
    source: prose
    seededBy: parser
    verified: false
  5.2-R2:
    id: 5.2-R2
    rev: 800-63b-r4
    sectionNumber: "5.2"
    ordinal: 2
    level: SHALL
    text: Session management uses two types of timeouts. An overall timeout limits the duration of an
      authenticated session to a specific period following authentication or a previous
      reauthentication. An inactivity timeout terminates a session without activity from the
      subscriber for a specific period. For both types of timeouts, the RP MAY alert the subscriber
      that the session is about to be terminated and allow the subscriber to make the session active
      or reauthenticate as appropriate before the session expires. When either timeout expires, the
      session SHALL be terminated. Session activity SHALL reset the inactivity timeout, and
      successful reauthentication during a session SHALL reset both timeouts.
    textHash: cff7245be682
    source: prose
    seededBy: parser
    verified: false
  5.2-R3:
    id: 5.2-R3
    rev: 800-63b-r4
    sectionNumber: "5.2"
    ordinal: 3
    level: SHALL
    text: The overall and inactivity timeout expiration limits depend on several factors, including the
      AAL of the session, the environment in which the session is conducted (e.g., whether the
      subscriber is in a restricted area), the type of endpoint being used (e.g., mobile
      application, web-based), whether the endpoint is a managed device,1 and the nature of the
      application itself. The limits MAY also be extended when higher security session maintenance
      technologies (e.g., device-bound mechanisms) are used. Agencies SHALL establish and document
      the inactivity and overall time limits being enforced in a system security plan, such as that
      described in [SP800-39]. Detailed requirements for each AAL are given in Sec. 2.1.3, Sec.
      2.2.3, and Sec. 2.3.3.
    textHash: 541dc833bac0
    source: prose
    seededBy: parser
    verified: false
  5.2-R4:
    id: 5.2-R4
    rev: 800-63b-r4
    sectionNumber: "5.2"
    ordinal: 4
    level: SHALL
    text: Consequently, when an RP session expires and the RP requires reauthentication, it is possible
      that the session at the IdP has not expired and that a new assertion could be generated from
      this session at the IdP without explicitly reauthenticating the subscriber. The IdP can
      communicate the time and details of the authentication event to the RP, but the RP SHALL be
      authoritative as to whether the reauthentication requirements have been met. Section 4.7 of
      [SP800-63C] provides additional details and requirements for session management within a
      federation context.
    textHash: 5cbd22da039b
    source: prose
    seededBy: parser
    verified: false
  5.3-R1:
    id: 5.3-R1
    rev: 800-63b-r4
    sectionNumber: "5.3"
