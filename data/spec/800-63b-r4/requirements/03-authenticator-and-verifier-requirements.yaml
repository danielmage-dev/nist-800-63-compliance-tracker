  3.2.5-R2:
    id: 3.2.5-R2
    rev: 800-63b-r4
    sectionNumber: 3.2.5
    ordinal: 2
    level: SHALL_NOT
    text: Phishing resistance requires single- or multi-factor cryptographic authentication.
      Authenticators that involve the manual entry of an authenticator output (e.g., out-of-band and
      OTP authenticators) SHALL NOT be considered phishing-resistant because the manual entry does
      not bind the authenticator output to the specific session being authenticated. For example, an
      impostor verifier could relay an authenticator output to the verifier and successfully
      authenticate.
    textHash: 0f76ee66eb3a
    source: prose
    seededBy: parser
    verified: false
  3.2.5.1-R1:
    id: 3.2.5.1-R1
    rev: 800-63b-r4
    sectionNumber: 3.2.5.1
    ordinal: 1
    level: SHALL
    text: An authentication protocol with channel binding SHALL establish an authenticated protected
      channel with the verifier. The protocol SHALL then strongly and irreversibly bind a channel
      identifier negotiated in establishing the authenticated protected channel to the authenticator
      output (e.g., by signing the two values together using a private key controlled by the
      claimant for which the public key is known to the verifier). The verifier SHALL validate the
      signature or other information used to prove phishing resistance. This prevents an impostor
      verifier — even one that has obtained a certificate that represents the actual verifier — from
      successfully relaying that authentication on a different authenticated protected channel.
    textHash: 81795d67d311
    source: prose
    seededBy: parser
    verified: false
  3.2.5.2-R1:
    id: 3.2.5.2-R1
    rev: 800-63b-r4
    sectionNumber: 3.2.5.2
    ordinal: 1
    level: SHALL
    text: An authentication protocol with verifier name binding SHALL establish an authenticated
      protected channel with the verifier. The protocol SHALL then generate an authenticator output
      that is cryptographically bound to a verifier identifier that is authenticated as part of the
      protocol. In the case of DNS identifiers, the verifier identifier SHALL be either the
      authenticated hostname of the verifier or a parent domain that is at least one level below the
      public suffix [PSL] associated with that hostname. The binding MAY be established by choosing
      an associated authenticator secret, deriving an authenticator secret using the verifier
      identifier, cryptographically signing the authenticator output with the verifier identifier,
      or using similar cryptographically secure means.
    textHash: 7ce62d9f8ad2
    source: prose
    seededBy: parser
    verified: false
