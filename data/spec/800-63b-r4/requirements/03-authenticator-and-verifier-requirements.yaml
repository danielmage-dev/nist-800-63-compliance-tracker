    sectionNumber: 3.2.8
    ordinal: 1
    level: SHALL
    text: An authentication process demonstrates intent if it requires the claimant to respond
      explicitly to each authentication or reauthentication request. The goal of authentication
      intent is to make it more difficult for authenticators (e.g., multi-factor cryptographic
      authenticators) to be used without the claimant’s knowledge, such as by malware on the
