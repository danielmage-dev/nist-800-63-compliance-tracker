    id: 3.2.2-R1
    rev: 800-63b-r4
    sectionNumber: 3.2.2
    ordinal: 1
    level: SHALL
    text: When required by the authenticator type descriptions in Sec. 3.1, the verifier SHALL implement
      controls to protect against online guessing attacks. Unless otherwise specified in the
      description of a given authenticator, the verifier SHALL limit consecutive failed
      authentication attempts using a specific authenticator on a single subscriber account to no
      more than 100 by disabling that authenticator. If more than one authenticator is involved with
      an excessive number of authentication attempts (e.g., single-factor cryptographic
      authenticator and centrally verified password), both authenticators SHALL be disabled.
      Authenticators that have been disabled SHALL be required to rebind to the subscriber account,
      as described in Sec. 4.1, to be usable in the future.
    textHash: 8f934f5a83cd
    source: prose
    seededBy: parser
    verified: false
