    id: 3.2.11.2-R1
    rev: 800-63b-r4
    sectionNumber: 3.2.11.2
    ordinal: 1
    level: SHALL
    text: The potential for such attacks on wireless connections depends on the technology’s effective
      range. To minimize the attack surface for threats to the authenticator-endpoint connection,
      the authentication process SHALL require physical proximity between the authenticator and
      endpoint by establishing a wireless connection with a range of no more than 240 meters.3
