    ordinal: 10
    level: SHALL
    text: If the out-of-band authenticator requests approval over the secondary communication channel
      rather than by presenting a secret that the claimant transfers to the primary communication
      channel, it SHALL accept a transfer of the secret from the primary channel and send it to the
      verifier over the secondary channel to associate the approval with the authentication
