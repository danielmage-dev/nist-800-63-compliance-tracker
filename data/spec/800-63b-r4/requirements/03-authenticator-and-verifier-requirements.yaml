  3.2.13-R1:
    id: 3.2.13-R1
    rev: 800-63b-r4
    sectionNumber: 3.2.13
    ordinal: 1
    level: SHALL_NOT
    text: To be considered non-exportable, an authenticator SHALL either be a separate piece of hardware
      or an embedded processor or execution environment (e.g., secure element, TEE, TPM). These
      hardware authenticators and embedded processors are separate from a host processor, such as
      the CPU on a laptop or mobile device. A non-exportable authenticator SHALL be designed to
      prohibit the export of the authentication secret to the host processor and SHALL NOT be
      capable of being reprogrammed by the host processor to allow the secret to be extracted. The
      authenticator is subject to applicable [FIPS140] requirements. Organizations SHOULD employ
      authenticators that have undergone independent security testing, such as authenticators
      validated to [FIPS140] security level 2 overall with level 3 physical security6 or evaluated
      against relevant Common Criteria Protection Profiles.
