    level: SHALL
    text: Authenticators that use activation secrets SHALL require the secrets to be at least four
      characters in length and SHOULD require the secrets to be at least six characters in length.
      Activation secrets MAY be entirely numeric (i.e., a PIN). Otherwise, all printing ASCII
      [RFC20] characters, the space character, and Unicode [ISO/ISC 10646] characters SHOULD be
      permitted in activation secrets. The authenticator or its management tools SHOULD implement a
      blocklist to discourage subscribers from selecting commonly used activation secrets (e.g.,
      123456).
    textHash: d89e7fba276c
    source: prose
    seededBy: parser
    verified: false
  3.2.10-R3:
    id: 3.2.10-R3
    rev: 800-63b-r4
    sectionNumber: 3.2.10
    ordinal: 3
    level: SHALL
    text: The authenticator or verifier SHALL implement a retry-limiting mechanism that limits the
      number of consecutive failed activation attempts using the authenticator to no more than 10.
      If an incorrect activation secret entry causes the authenticator to provide an invalid output
      to the central verifier, the verifier MAY implement this retry-limiting mechanism. Otherwise,
      retry limiting SHALL be implemented in the authenticator. Once the limit of attempts is
      reached, the authenticator SHALL be disabled, and a different authenticator SHALL be required
      for authentication.
    textHash: 6dcecbb54333
    source: prose
    seededBy: parser
    verified: false
  3.2.10-R4:
    id: 3.2.10-R4
    rev: 800-63b-r4
    sectionNumber: 3.2.10
    ordinal: 4
    level: SHALL
    text: For authenticators that are usable at AAL3, verification of activation secrets SHALL be
      performed in a hardware-protected environment (e.g., a secure element, TPM, or TEE). At AAL2,
      if a hardware-protected environment is not used, the authenticator SHALL use the activation
      secret to derive a key used to decrypt the authentication key.
    textHash: d057f1fffe38
    source: prose
    seededBy: parser
    verified: false
  3.2.10-R5:
    id: 3.2.10-R5
    rev: 800-63b-r4
    sectionNumber: 3.2.10
    ordinal: 5
    level: SHALL
    text: Submitting the activation factor SHALL be a separate operation from unlocking the host device
      (e.g., smartphone). However, the same activation factor used to unlock the host device MAY be
      used in the authentication operation. Agencies MAY relax this requirement for authenticators
      that are managed by or on behalf of the CSP (e.g., via mobile device management), are
      constrained to have short agency-determined inactivity timeouts, and use device activation
      factors that meet the corresponding requirements in this section.
    textHash: 3266eea5363b
    source: prose
    seededBy: parser
    verified: false
  3.2.11-R1:
    id: 3.2.11-R1
    rev: 800-63b-r4
    sectionNumber: 3.2.11
    ordinal: 1
    level: SHALL
    text: Cryptographic authenticators require a trustworthy connection between the authenticator and
      the endpoint being authenticated that provides resistance to eavesdropping, injection, and
      relay attacks. This connection SHALL be made using a wired connection (e.g., USB or direct
      connection with a smartcard), a wireless technology, or a hybrid of those technologies,
      including network connections.
    textHash: 15e51d3773ad
    source: prose
    seededBy: parser
    verified: false
  3.2.11-R2:
    id: 3.2.11-R2
    rev: 800-63b-r4
    sectionNumber: 3.2.11
    ordinal: 2
    level: SHALL
    text: Approved cryptography SHALL be used for all cases in which cryptographic operations are
      required. All communication of authentication data between authenticators and endpoints SHALL
      occur directly between those devices or through an authenticated protected channel between the
      authenticator and endpoint.
    textHash: fda928f6e130
    source: prose
    seededBy: parser
    verified: false
  3.2.11.1-R1:
    id: 3.2.11.1-R1
    rev: 800-63b-r4
    sectionNumber: 3.2.11.1
    ordinal: 1
    level: SHOULD
    text: Wired connections, including those with embedded authenticators, MAY be assumed to be
      trustworthy because their attack surface is minimal. Claimants SHOULD be advised to use
      trusted hardware (e.g., cables, adapters) to ensure that they have not been compromised.
    textHash: bcd04cf52b6f
    source: prose
    seededBy: parser
