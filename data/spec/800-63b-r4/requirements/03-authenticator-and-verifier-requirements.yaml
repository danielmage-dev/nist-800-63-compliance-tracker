    sectionNumber: 3.1.3.2
    ordinal: 1
    level: SHALL_NOT
    text: The verifier waits for an authenticated protected channel to be established with the
      out-of-band authenticator and verifies its identifying key. The verifier SHALL NOT store the
      identifying key itself but SHALL use a verification method (e.g., an approved hash function or
