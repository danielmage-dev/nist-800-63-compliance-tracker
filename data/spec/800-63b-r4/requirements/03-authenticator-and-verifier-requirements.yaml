      compromised passwords. The entire password SHALL be subject to comparison, not substrings or
      words that might be contained therein. For example, the list may include:"
    source: prose
    seededBy: parser
    verified: false
  3.1.1.2-R13:
    id: 3.1.1.2-R13
    rev: 800-63b-r4
    sectionNumber: 3.1.1.2
    ordinal: 13
    level: SHALL
    text: Context-specific words, such as the name of the service, the username, and derivatives thereof
    textHash: 0b8b3de6758a
    context: "When processing a request to establish or change a password, verifiers SHALL compare the
      prospective secret against a blocklist that contains known commonly used, expected, or
      compromised passwords. The entire password SHALL be subject to comparison, not substrings or
      words that might be contained therein. For example, the list may include:"
    source: prose
    seededBy: parser
    verified: false
  3.1.1.2-R14:
    id: 3.1.1.2-R14
    rev: 800-63b-r4
    sectionNumber: 3.1.1.2
    ordinal: 14
    level: SHALL
    text: If the chosen password is found on the blocklist, the CSP SHALL require the subscriber to
      select a different secret and SHALL provide the reason for rejection. Since the blocklist is
      used to defend against brute-force attacks and unsuccessful attempts are rate-limited, the
      blocklist SHOULD be of sufficient size to prevent subscribers from choosing passwords that
      attackers are likely to guess before reaching the attempt limit.
    textHash: f78c61111eda
    source: prose
    seededBy: parser
    verified: false
  3.1.1.2-R15:
    id: 3.1.1.2-R15
    rev: 800-63b-r4
    sectionNumber: 3.1.1.2
    ordinal: 15
    level: SHALL
    text: Verifiers SHALL offer guidance to the subscriber to help the subscriber choose a strong
      password. This is particularly important following the rejection of a password on the
      blocklist as it discourages trivial modifications of listed weak passwords [Blocklists].
    textHash: 9aeeed8cb9a3
    source: prose
    seededBy: parser
    verified: false
  3.1.1.2-R16:
    id: 3.1.1.2-R16
    rev: 800-63b-r4
    sectionNumber: 3.1.1.2
    ordinal: 16
    level: SHALL
    text: Verifiers SHALL implement a rate-limiting mechanism that effectively limits the number of
      failed authentication attempts that can be made on the subscriber account, as described in
      Sec. 3.2.2.
    textHash: 6560899f3460
    source: prose
    seededBy: parser
    verified: false
  3.1.1.2-R17:
    id: 3.1.1.2-R17
    rev: 800-63b-r4
    sectionNumber: 3.1.1.2
    ordinal: 17
    level: SHALL
    text: Verifiers SHALL allow the use of password managers and autofill functionality. Verifiers
      SHOULD permit claimants to use the “paste” function when entering a password to facilitate
      password manager use when password autofill APIs are unavailable. Password managers have been
      shown to increase the likelihood that subscribers will choose stronger passwords, particularly
      if the password managers include password generators [Managers].
    textHash: 00bd60974830
    source: prose
    seededBy: parser
    verified: false
  3.1.1.2-R18:
    id: 3.1.1.2-R18
    rev: 800-63b-r4
    sectionNumber: 3.1.1.2
    ordinal: 18
    level: SHOULD
    text: To help the claimant successfully enter a password, the verifier SHOULD offer an option to
      display the password — rather than a series of dots or asterisks — while it is entered and
      until it is submitted to the verifier. This allows the claimant to confirm their entry if they
      are in a location where their screen is unlikely to be observed. The verifier MAY also permit
      the claimant’s device to display individual entered characters for a short time after each
      character is typed to verify the correct entry. This is common on mobile devices.
    textHash: ff7a9e6ab684
    source: prose
    seededBy: parser
    verified: false
  3.1.1.2-R19:
    id: 3.1.1.2-R19
    rev: 800-63b-r4
    sectionNumber: 3.1.1.2
    ordinal: 19
    level: MAY
    text: Verifiers MAY make limited allowances for mistyping (e.g., removing leading and trailing
      whitespace characters before verification, allowing the verification of passwords with
      differing cases for the leading character) if the password remains at least the required
      minimum length after such processing and the complexity of the resulting password is not
      significantly reduced.
    textHash: 4c4e452c8c53
    source: prose
    seededBy: parser
    verified: false
  3.1.1.2-R20:
    id: 3.1.1.2-R20
    rev: 800-63b-r4
    sectionNumber: 3.1.1.2
    ordinal: 20
    level: SHALL
    text: Verifiers and CSPs SHALL use approved encryption and an authenticated protected channel when
      requesting passwords.
    textHash: b665d6183b87
    source: prose
    seededBy: parser
    verified: false
  3.1.1.2-R21:
    id: 3.1.1.2-R21
    rev: 800-63b-r4
    sectionNumber: 3.1.1.2
    ordinal: 21
    level: SHALL
    text: Verifiers SHALL store passwords in a form that is resistant to offline attacks. Passwords
      SHALL be salted and hashed using a suitable password hashing scheme. Password hashing schemes
      take a password, a salt, and a cost factor as inputs and generate a password hash. Their
      purpose is to make each password guess more expensive for an attacker who has obtained a
      hashed password file, thereby making the cost of a guessing attack high or prohibitive. The
      chosen cost factor SHOULD be as high as practical without negatively impacting verifier
      performance. It SHOULD be increased over time to account for increases in computing
      performance. An approved password hashing scheme published in the latest revision of
      [SP800-132] or updated NIST guidelines on password hashing schemes SHOULD be used. The chosen
      output length of the password verifier, excluding the salt and versioning information, SHOULD
      be the same as the length of the underlying password hashing scheme output.
    textHash: f287203a4757
    source: prose
    seededBy: parser
    verified: false
  3.1.1.2-R22:
    id: 3.1.1.2-R22
    rev: 800-63b-r4
    sectionNumber: 3.1.1.2
    ordinal: 22
    level: SHALL
    text: The salt SHALL be at least 32 bits in length and chosen to minimize salt value collisions
      among stored hashes (i.e., to prevent multiple subscriber accounts from having the same hashed
      password). Both the salt value and the resulting hash SHALL be stored for each password. A
      reference to the password hashing scheme used, including the cost factor, SHOULD be stored for
      each password to allow migration to new algorithms and work factors.
    textHash: 5cf568ab5cc3
    source: prose
    seededBy: parser
    verified: false
  3.1.1.2-R23:
    id: 3.1.1.2-R23
    rev: 800-63b-r4
    sectionNumber: 3.1.1.2
    ordinal: 23
    level: SHALL
    text: In addition, verifiers SHOULD perform an additional iteration of a keyed hashing or encryption
      operation using a secret key known only to the verifier. If used, this key value SHALL be
      generated by an approved random bit generator, as described in Sec. 3.2.12. The secret key
      value SHALL be stored separately from the hashed passwords. It SHOULD be stored and used
      within a hardware-protected area, such as a hardware security module or trusted execution
      environment (TEE), such as a trusted platform module (TPM). With this additional iteration,
      brute-force attacks on the hashed passwords are impractical as long as the secret key value
      remains secret.
    textHash: 0e6f53b31cee
    source: prose
    seededBy: parser
    verified: false
  3.1.2.1-R1:
    id: 3.1.2.1-R1
    rev: 800-63b-r4
    sectionNumber: 3.1.2.1
    ordinal: 1
    level: SHALL
    text: CSPs that create look-up secret authenticators SHALL use an approved random bit generator, as
      described in Sec. 3.2.12, to generate the list of secrets and SHALL deliver the authenticator
      list securely to the subscriber (e.g., in an in-person session, via an online session, through
      the postal mail to a contact address). If delivered via an online session, the session SHALL
      be authenticated by the subscriber at AAL2 or higher and SHALL deliver the secrets through an
      authenticated protected channel and in accordance with the post-enrollment binding
      requirements in Sec. 4.1.2. Look-up secrets SHALL be at least six decimal digits (or
      equivalent) in length. Additional requirements described in Sec. 3.1.2.2 may also apply,
      depending on their length.
    textHash: f76e0d8f73f9
    source: prose
    seededBy: parser
    verified: false
  3.1.2.2-R1:
    id: 3.1.2.2-R1
    rev: 800-63b-r4
    sectionNumber: 3.1.2.2
    ordinal: 1
    level: SHALL
    text: Verifiers of look-up secrets SHALL prompt the claimant for a secret from their authenticator.
      A secret from a look-up secret authenticator SHALL be used successfully only once. If the
      look-up secret is derived from a grid card, each grid cell SHOULD be used only once, which
      limits the number of authentications that can be accomplished using look-up secrets. A very
      long list of secrets is potentially required.
    textHash: 5b9644d9add5
    source: prose
    seededBy: parser
    verified: false
  3.1.2.2-R2:
    id: 3.1.2.2-R2
    rev: 800-63b-r4
    sectionNumber: 3.1.2.2
    ordinal: 2
    level: SHALL
    text: Verifiers SHALL store look-up secrets in a form that is resistant to offline attacks. All
      look-up secrets SHALL be stored in a hashed form using an approved hashing function.
    textHash: 0b528225aba0
    source: prose
    seededBy: parser
    verified: false
  3.1.2.2-R3:
    id: 3.1.2.2-R3
    rev: 800-63b-r4
    sectionNumber: 3.1.2.2
    ordinal: 3
    level: SHALL
    text: Look-up secrets that are shorter than the minimum security strength specified in the latest
      revision of [SP800-131A] (i.e., 112 bits as of the date of this publication) SHALL be stored
      in a salted and hashed form using a suitable password hashing scheme, as described in Sec.
      3.1.1.2. The salt value SHALL be at least 32 bits in length and arbitrarily chosen to minimize
      salt value collisions among stored hashes. Both the salt value and the resulting hash SHALL be
      stored for each look-up secret.
    textHash: 0809a6cf00c6
    context: "Look-up secrets SHALL be at least six decimal digits (or equivalent) in length, as
