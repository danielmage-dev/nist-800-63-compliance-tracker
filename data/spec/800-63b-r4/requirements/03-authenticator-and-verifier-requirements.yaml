    id: 3.1.1.2-R12
    rev: 800-63b-r4
    sectionNumber: 3.1.1.2
    ordinal: 12
    level: SHALL
    text: Dictionary words
    textHash: 141901b0727a
    context: "When processing a request to establish or change a password, verifiers SHALL compare the
