    sectionNumber: 3.2.2
    ordinal: 6
    level: SHALL
    text: Following successful authentication at a given AAL, the verifier SHOULD reset the retry count
      of the authenticators that were used. If this is provided, the maximum AAL of the
      authenticator being reset SHALL not exceed the AAL of the session from which it is being
      reset. If the subscriber cannot authenticate at the required AAL, the account recovery
      procedures in Sec. 4.2 SHALL be used.
