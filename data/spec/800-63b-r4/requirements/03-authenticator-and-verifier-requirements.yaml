    verified: false
  3.2.3-R1:
    id: 3.2.3-R1
    rev: 800-63b-r4
    sectionNumber: 3.2.3
    ordinal: 1
    level: SHALL
    text: Biometrics SHALL only be used as part of multi-factor authentication with a physical
      authenticator (i.e., “something you have”). The biometric characteristic SHALL be presented
      and compared for each authentication operation. An alternative non-biometric authentication
      option SHALL always be provided to the subscriber. Biometric data SHALL be treated and secured
      as sensitive personal information.
    textHash: 35ba1f7a54aa
    source: prose
    seededBy: parser
    verified: false
  3.2.3.1-R1:
    id: 3.2.3.1-R1
    rev: 800-63b-r4
    sectionNumber: 3.2.3.1
    ordinal: 1
    level: SHALL
    text: The biometric system SHALL operate with an FMR [ISO/IEC2382-37] of one in 10000 or better for
      all demographic groups. Demographic categories to be considered SHALL include sex and skin
      tone when these factors affect biometric performance. This FMR SHALL be achieved under the
      conditions of a conformant attack (i.e., zero-effort impostor attempt), as defined in
      [ISO/IEC30107-1]. The biometric system SHOULD demonstrate a false non-match rate (FNMR) of
      less than 5 %. Biometric performance SHALL be tested in accordance with [ISO/IEC19795-1]. The
      biometric system SHALL be configured with a fixed threshold; it is not feasible to change the
      threshold for each demographic.
    textHash: 85cd28af8ffe
    source: prose
    seededBy: parser
    verified: false
  3.2.3.2-R1:
    id: 3.2.3.2-R1
    rev: 800-63b-r4
    sectionNumber: 3.2.3.2
    ordinal: 1
    level: SHALL_NOT
    text: The biometric system SHOULD implement PAD for iris and fingerprint modalities and SHALL
      implement PAD for facial recognition. Biometric comparison based on voice SHALL NOT be used.
      Testing the biometric system for deployment SHOULD demonstrate an impostor attack presentation
      accept rate (IAPAR) of less than 0.07. Presentation attack resistance SHOULD be tested in
      accordance with Clause 13 of [ISO/IEC30107-3] following security evaluation methodologies in
      [ISO/IEC19792] or [ISO/IEC19989-1] and [ISO/IEC19989-3]. The PAD decision MAY be made either
      locally on the claimant’s device or by a central verifier.
    textHash: 48321b22290a
    source: prose
    seededBy: parser
    verified: false
  3.2.3.3-R1:
    id: 3.2.3.3-R1
    rev: 800-63b-r4
    sectionNumber: 3.2.3.3
    ordinal: 1
    level: SHALL
    text: The biometric system SHALL allow no more than five consecutive failed authentication attempts
      or 10 consecutive failed attempts if PAD is implemented and meets the above requirements. Once
      that limit has been reached, the biometric authenticator SHALL impose a delay of at least 30
      seconds before each subsequent attempt with an overall limit of no more than 50 consecutive
      failed authentication attempts or 100 if PAD is implemented due to the mitigation of
      presentation attacks. Once the overall limit is reached, the biometric system SHALL disable
      biometric authentication and offer another factor (e.g., a different biometric modality or an
      activation secret if it is not a required factor) if such an alternative method is already
      available. These limits are upper bounds, and agencies MAY make risk-based decisions to impose
      lower limits.
    textHash: ff77223138de
    source: prose
    seededBy: parser
    verified: false
