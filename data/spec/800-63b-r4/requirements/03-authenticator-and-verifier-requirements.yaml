    sectionNumber: 3.2.11.2
    ordinal: 3
    level: SHALL
    text: Through an association process that is similar to a pairing process but does not require a
      persistent relationship between devices to establish a key for encrypted communication between
      the authenticator and endpoint. The association process SHALL employ a pairing code4 or other
      shared secret between the devices. Either the authenticator or endpoint SHALL have a pairing
      code that MAY be printed on the device. The pairing code SHALL be at least six decimal digits
      (or equivalent) in length. It SHALL be conveyed between the devices by manual entry or using a
