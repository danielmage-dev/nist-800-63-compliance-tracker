  3.1.3.1-R1:
    id: 3.1.3.1-R1
    rev: 800-63b-r4
    sectionNumber: 3.1.3.1
    ordinal: 1
    level: SHALL
    text: The out-of-band authenticator SHALL establish a separate channel with the verifier to retrieve
      the out-of-band secret or authentication request. This channel is considered to be out-of-band
      with respect to the primary communication channel (even if it terminates on the same device),
      provided that the device does not leak information from one channel to the other without the
      claimant’s participation.
