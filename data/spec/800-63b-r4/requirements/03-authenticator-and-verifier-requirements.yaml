    sectionNumber: 3.1.3.1
    ordinal: 9
    level: SHOULD_NOT
    text: For single-factor out-of-band authenticators, if a secret is sent by the verifier to the
      out-of-band device, the device SHOULD NOT display the authentication secret while it is locked
      by the owner. Rather, the device SHOULD require the presentation and verification of a PIN,
