chapter: "3"
rev: 800-63b-r4
requirements:
  3-R1:
    id: 3-R1
    rev: 800-63b-r4
    sectionNumber: "3"
    ordinal: 1
    level: SHOULD_NOT
    text: In many circumstances, subscribers need to share devices that are used in authentication
      processes, such as a family phone that receives OTPs. In public-facing applications, CSPs
      SHOULD NOT prevent a device from being registered as an authenticator by multiple subscribers.
      However, they MAY establish restrictions to prevent large-scale fraud or misuse (e.g.,
      limiting the total number of subscriber accounts a single device can be registered with).
    textHash: 3a9ec715dd72
    source: prose
    seededBy: parser
    verified: false
  3.1.1.1-R1:
    id: 3.1.1.1-R1
    rev: 800-63b-r4
    sectionNumber: 3.1.1.1
    ordinal: 1
    level: SHALL
    text: Passwords SHALL either be chosen by the subscriber or assigned randomly by the CSP.
    textHash: b1f2180fc34b
    source: prose
    seededBy: parser
    verified: false
  3.1.1.1-R2:
    id: 3.1.1.1-R2
    rev: 800-63b-r4
    sectionNumber: 3.1.1.1
    ordinal: 2
    level: SHALL_NOT
    text: If the CSP disallows a chosen password because it is on a blocklist of commonly used,
      expected, or compromised values (see Sec. 3.1.1.2), the subscriber SHALL be required to choose
      a different password. Other composition requirements for passwords SHALL NOT be imposed. A
      rationale for this is presented in Appendix A, Strength of Passwords.
    textHash: 5ead69173222
    source: prose
    seededBy: parser
    verified: false
  3.1.1.2-R1:
    id: 3.1.1.2-R1
    rev: 800-63b-r4
    sectionNumber: 3.1.1.2
    ordinal: 1
    level: SHALL
    text: Verifiers and CSPs SHALL require passwords that are used as a single-factor authentication
      mechanism to be a minimum of 15 characters in length. Verifiers and CSPs MAY allow passwords
      that are only used as part of multi-factor authentication processes to be shorter but SHALL
      require them to be a minimum of eight characters in length.
    textHash: df97e64ce4fb
    source: prose
    seededBy: parser
    verified: false
  3.1.1.2-R2:
    id: 3.1.1.2-R2
    rev: 800-63b-r4
    sectionNumber: 3.1.1.2
    ordinal: 2
    level: SHOULD
    text: Verifiers and CSPs SHOULD permit a maximum password length of at least 64 characters.
    textHash: 17f39df400d2
    source: prose
    seededBy: parser
    verified: false
  3.1.1.2-R3:
    id: 3.1.1.2-R3
    rev: 800-63b-r4
    sectionNumber: 3.1.1.2
    ordinal: 3
    level: SHOULD
    text: Verifiers and CSPs SHOULD accept all printing ASCII [RFC20] characters and the space character
      in passwords.
    textHash: 4cc5dc76d5c8
    source: prose
    seededBy: parser
    verified: false
  3.1.1.2-R4:
    id: 3.1.1.2-R4
    rev: 800-63b-r4
    sectionNumber: 3.1.1.2
    ordinal: 4
    level: SHALL
    text: Verifiers and CSPs SHOULD accept Unicode [ISO/ISC 10646] characters in passwords. Each Unicode
      code point SHALL be counted as a single character when evaluating password length.
    textHash: ae6b34411a68
    source: prose
    seededBy: parser
    verified: false
  3.1.1.2-R5:
    id: 3.1.1.2-R5
    rev: 800-63b-r4
    sectionNumber: 3.1.1.2
    ordinal: 5
    level: SHALL_NOT
    text: Verifiers and CSPs SHALL NOT impose other composition rules (e.g., requiring mixtures of
      different character types) for passwords.
    textHash: 9b01efdb5b69
    source: prose
    seededBy: parser
    verified: false
  3.1.1.2-R6:
    id: 3.1.1.2-R6
    rev: 800-63b-r4
    sectionNumber: 3.1.1.2
    ordinal: 6
    level: SHALL_NOT
    text: Verifiers and CSPs SHALL NOT require subscribers to change passwords periodically. However,
      verifiers SHALL force a change if there is evidence that the authenticator has been
      compromised.
    textHash: 9da5cb53f249
    source: prose
    seededBy: parser
    verified: false
  3.1.1.2-R7:
    id: 3.1.1.2-R7
    rev: 800-63b-r4
    sectionNumber: 3.1.1.2
    ordinal: 7
    level: SHALL_NOT
    text: Verifiers and CSPs SHALL NOT permit the subscriber to store a hint (e.g., a reminder of how
      the password was created) that is accessible to an unauthenticated claimant.
    textHash: 507d9594a202
    source: prose
    seededBy: parser
    verified: false
  3.1.1.2-R8:
    id: 3.1.1.2-R8
    rev: 800-63b-r4
    sectionNumber: 3.1.1.2
    ordinal: 8
    level: SHALL_NOT
    text: Verifiers and CSPs SHALL NOT prompt subscribers to use knowledge-based authentication (KBA)
      (e.g., “What was the name of your first pet?”) or security questions when choosing passwords.
    textHash: 04ccb98074ac
    source: prose
    seededBy: parser
    verified: false
  3.1.1.2-R9:
    id: 3.1.1.2-R9
    rev: 800-63b-r4
    sectionNumber: 3.1.1.2
    ordinal: 9
    level: SHALL
    text: Verifiers SHALL request the password to be provided in full (not a subset of it) and SHALL
      verify the entire submitted password (e.g., not truncate it).
    textHash: 17450ea70e2b
    source: prose
    seededBy: parser
    verified: false
  3.1.1.2-R10:
    id: 3.1.1.2-R10
    rev: 800-63b-r4
    sectionNumber: 3.1.1.2
    ordinal: 10
    level: SHOULD
    text: If Unicode characters are accepted in passwords, the verifier SHOULD apply the normalization
      process for stabilized strings using the Normalization Form Canonical Composition (NFC)
      normalization defined in Sec. 12.1 of Unicode Normalization Forms [UAX15]. This process is
      applied before hashing the byte string that represents the password. Subscribers choosing
      passwords that contain Unicode characters SHOULD be advised that some endpoints may represent
      some characters differently, which would affect their ability to authenticate successfully.
    textHash: 7ed016b894ae
    source: prose
    seededBy: parser
    verified: false
  3.1.1.2-R11:
    id: 3.1.1.2-R11
    rev: 800-63b-r4
    sectionNumber: 3.1.1.2
    ordinal: 11
    level: SHALL
    text: Passwords obtained from previous breach corpuses
    textHash: 616d2f446908
