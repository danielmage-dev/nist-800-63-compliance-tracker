    level: SHALL
    text: At AAL2, authentication SHALL use either a multi-factor authenticator or a combination of two
      separate authentication factors. A multi-factor authenticator requires two factors to execute
      a single authentication event, such as a cryptographically secure device with an integrated
      biometric sensor that is required to activate the device. Authenticator requirements are
      specified in Sec. 3.
