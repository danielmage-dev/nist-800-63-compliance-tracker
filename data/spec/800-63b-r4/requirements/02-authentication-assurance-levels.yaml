chapter: "2"
rev: 800-63b-r4
requirements:
  2-R1:
    id: 2-R1
    rev: 800-63b-r4
    sectionNumber: "2"
    ordinal: 1
    level: SHALL
    text: To satisfy the requirements of a given AAL and be recognized as a subscriber, a claimant SHALL
      authenticate to an RP (or IdP, as described in [SP800-63C]) with a process whose strength is
      equal to or greater than the requirements at that level. The authentication process results in
      an identifier that uniquely identifies the subscriber each time they authenticate to that RP.
      The identifier MAY be pseudonymous. Other attributes that identify the subscriber as a unique
      subject MAY also be provided. Detailed normative requirements for authenticators and verifiers
      at each AAL are provided in Sec. 3. See [SP800-63] Sec. 3 for details on how to choose the
      most appropriate AAL.
    textHash: b7db6a5894d2
    source: prose
    seededBy: parser
    verified: false
  2-R2:
    id: 2-R2
    rev: 800-63b-r4
    sectionNumber: "2"
    ordinal: 2
    level: SHALL
    text: Personal information collected during and after identity proofing (see [SP800-63A]) MAY be
      made available to the subscriber by the digital identity service through the subscriber
      account. The release or online availability of any personal information by federal agencies
      requires multi-factor authentication in accordance with [EO13681]. Therefore, federal agencies
      SHALL select a minimum of AAL2 when personal information is made available online.
    textHash: d1e649de78b3
    source: prose
    seededBy: parser
    verified: false
  2-R3:
    id: 2-R3
    rev: 800-63b-r4
    sectionNumber: "2"
    ordinal: 3
    level: SHALL
    text: At all AALs, indicators of potential fraud, including applicable indicators described in Sec.
      5.3, MAY be used to lower the risk of misauthentication. For example, authentication from an
      unexpected geolocation or IP address block (e.g., a cloud service) might prompt the use of
      additional risk-based controls. CSPs or verifiers SHALL assess their use of indicators of
      potential fraud for efficacy and to identify and mitigate potential negative impacts on their
      user populations. CSPs or verifiers SHALL include fraud indicators in the authentication
      privacy risk assessment. The use of potential fraud indicators prior to or during the
      authentication process does not impact or change the AAL of a transaction or substitute for an
      authentication factor.
    textHash: bee82fd4821b
    source: prose
    seededBy: parser
    verified: false
  2.1-R1:
    id: 2.1-R1
    rev: 800-63b-r4
    sectionNumber: "2.1"
    ordinal: 1
    level: SHOULD
    text: AAL1 provides basic confidence that the claimant controls an authenticator that is bound to
      the subscriber account. AAL1 requires either single-factor or multi-factor authentication
      using a wide range of available authentication technologies. Verifiers SHOULD make
      multi-factor authentication options available at AAL1 and encourage their use. Successful
      authentication requires that the claimant prove possession and control of the authenticator
      through a secure authentication protocol.
    textHash: 18e72aff8de0
    source: prose
    seededBy: parser
    verified: false
