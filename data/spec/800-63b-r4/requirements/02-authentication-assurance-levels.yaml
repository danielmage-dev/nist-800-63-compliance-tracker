    sectionNumber: 2.3.2
    ordinal: 2
    level: SHALL_NOT
    text: Single-factor and multi-factor authenticators used at AAL3 SHALL be validated to meet the
      requirements of [FIPS140] Level 1 or higher overall. As described in Sec. 3.2.12,
      cryptographic authenticators used at AAL3 are required to provide a hardware-protected,
      isolated environment to prevent authentication keys from being leaked or extracted. Since
      syncable authenticators (described in Appendix B) require the private key to be exportable,
      syncable authenticators SHALL NOT be used at AAL3.
