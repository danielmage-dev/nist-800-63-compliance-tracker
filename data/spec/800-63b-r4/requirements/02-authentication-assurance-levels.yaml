    sectionNumber: 2.3.2
    ordinal: 1
    level: SHALL
    text: Authenticators used at AAL3 SHALL use approved cryptography. Communication between the
      claimant and verifier SHALL occur via one or more authenticated protected channels. The
      cryptographic authenticator used at AAL3 SHALL have a non-exportable private key and SHALL
      provide phishing resistance, as described in Sec. 3.2.5. The cryptographic authentication
      protocol SHALL be replay-resistant, as described in Sec. 3.2.7. All authentication and
      reauthentication processes at AAL3 SHALL demonstrate authentication intent from at least one
      authenticator, as described in Sec. 3.2.8. Cryptographic authenticators used at AAL3 SHALL use
      public-key cryptography to protect the authentication secrets from compromise of the verifier.
    textHash: 09ac3fa1b8e4
    source: prose
    seededBy: parser
    verified: false
  2.3.2-R2:
