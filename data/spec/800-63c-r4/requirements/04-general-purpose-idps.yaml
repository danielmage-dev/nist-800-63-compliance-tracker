  4.4-R1:
    id: 4.4-R1
    rev: 800-63c-r4
    sectionNumber: "4.4"
    ordinal: 1
    level: SHALL
    text: The RP SHALL associate the assertion validation keys and other relevant configuration
      information with the IdP’s identifier, as stipulated by the trust agreement. If the validation
      keys and configuration information are retrieved over a network connection, request and
      retrieval SHALL be made over an authenticated protected channel from a location that is
      associated with the IdP’s identifier by the trust agreement. In many federation protocols,
      this is accomplished by the RP fetching the public keys and configuration data from a URL that
      is specified in the trust agreement as being controlled by the IdP or offered on the IdP’s
      behalf. It is also possible for the RP to be configured directly with this information in a
      manual fashion, whereby the RP’s system administrator enters the IdP information directly into
      the RP software’s configuration.
    textHash: c0d0ad47f51f
    source: prose
    seededBy: parser
    verified: false
  4.4-R2:
    id: 4.4-R2
    rev: 800-63c-r4
    sectionNumber: "4.4"
    ordinal: 2
    level: SHALL
    text: Additionally, the RP SHALL register its information with either the IdP or an authority that
      the IdP trusts, as stipulated by the trust agreement. In many federation protocols, the RP is
      assigned an identifier during this stage, which the RP will use in subsequent communication
      with the IdP.
    textHash: 5133f89e2bea
    source: prose
    seededBy: parser
    verified: false
  4.4-R3:
    id: 4.4-R3
    rev: 800-63c-r4
    sectionNumber: "4.4"
    ordinal: 3
    level: MAY
    text: Parties that seek to federate MAY use a trusted third party to facilitate the discovery and
      registration processes if that trusted third party is identified in the trust agreement. For
      example, a consortium could use a hosted service that collects the configuration records of
      IdPs and RPs directly from participants. Instead of going to the IdP directly for its
      discovery record, an RP would instead go to this service and retrieve the key material for its
