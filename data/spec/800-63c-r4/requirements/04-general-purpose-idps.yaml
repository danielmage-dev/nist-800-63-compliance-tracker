    level: SHOULD
    text: If the RP is granted access to an identity API, the IdP SHOULD allow the RP to access the
      identity API for sufficient time to perform synchronization operations after the federation
      transaction has concluded. While an identity API is most often used during the first login,
      especially with a just-in-time provisioning process, on subsequent logins it is possible that
      attributes could have changed since the RP last fetched them. Therefore, the RP ought to be
      given access to the identity API beyond the initial login process to allow the RP to update
      its cache of attributes in the RP subscriber account. For example, if the assertion is valid
      for five minutes, access to the identity API could be valid for 30 minutes to allow the RP to
