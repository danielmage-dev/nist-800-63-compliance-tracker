    sectionNumber: "4.1"
    ordinal: 1
    level: SHALL
    text: In order to make subscriber accounts available through an IdP, the subscriber accounts need to
      be provisioned at the IdP. The means by which the subscriber account is provisioned to the IdP
      SHALL be disclosed in the trust agreement.
    textHash: 1978b6db610e
