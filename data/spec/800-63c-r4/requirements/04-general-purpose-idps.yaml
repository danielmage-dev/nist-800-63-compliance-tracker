    sectionNumber: 4.6.5
    ordinal: 6
    level: SHALL_NOT
    text: A provisioning API SHALL NOT be made available under a subscriber-driven trust agreement. The
      IdP SHALL NOT make a provisioning API available to any RP outside of an established trust
      agreement. The IdP SHALL provide access to a provisioning API only as part of a federated
      identity relationship with an RP to facilitate federation transactions with that RP and
      related functions, such as signaling revocation of the subscriber account. The IdP SHALL
      revoke an RP’s access to the provisioning API once access is no longer required by the RP for
      its functioning purposes or when the trust agreement is terminated.
    textHash: c84818e0c5bd
    source: prose
    seededBy: parser
    verified: false
  4.6.5-R7:
    id: 4.6.5-R7
    rev: 800-63c-r4
    sectionNumber: 4.6.5
    ordinal: 7
    level: SHALL
    text: Any provisioning API provided to the RP SHALL be under the control and jurisdiction of the
      IdP. External attribute providers MAY be used as information sources by the IdP to provide
      attributes through this provisioning API, but the IdP is responsible for the content and
      accuracy of the information provided by the referenced attribute providers.
    textHash: 01adddfb0634
    source: prose
    seededBy: parser
    verified: false
  4.6.5-R8:
    id: 4.6.5-R8
    rev: 800-63c-r4
    sectionNumber: 4.6.5
    ordinal: 8
    level: SHALL
    text: When a provisioning API is in use, the IdP SHALL signal to the RP when the state of a
      subscriber account has been changed, such as when the account has been terminated or disabled.
      When receiving such a signal, the RP SHALL remove the binding of the federated identifier from
      the account. The RP MAY terminate the RP subscriber account if it can no longer be accessed by
      the subscriber. The RP SHALL treat all personal information sourced from the provisioning API
      in accordance with Sec. 3.11.3.
    textHash: 3c87623269d1
    source: prose
    seededBy: parser
    verified: false
  4.6.6-R1:
    id: 4.6.6-R1
    rev: 800-63c-r4
    sectionNumber: 4.6.6
    ordinal: 1
    level: MAY
    text: The RP MAY collect and maintain additional attributes from the subscriber beyond those
      provided by the IdP. For example, the RP could collect a preferred display name directly from
      the subscriber that is not provided by the IdP. The RP could also have a separate agreement
      with an attribute provider that gives the RP access to an identity API that is not associated
      with the IdP. For example, the RP could receive a state license number from the IdP but use a
      separate attribute verification API to check whether a particular license number is currently
      valid. The assertion from the IdP binds the license to the subscriber, but the attribute
      verification API provides additional information beyond what the IdP can share or be
      authoritative for.
    textHash: 35d16652b4ef
    source: prose
    seededBy: parser
    verified: false
  4.6.6-R2:
    id: 4.6.6-R2
    rev: 800-63c-r4
    sectionNumber: 4.6.6
    ordinal: 2
    level: SHALL
    text: These attributes are governed separately from the trust agreement since they are collected by
      the RP outside of a federation transaction. However, all attributes in the RP subscriber
      account — regardless of source — SHALL be stored in accordance with Sec. 3.11.3.
    textHash: b7ad35cde322
    source: prose
    seededBy: parser
    verified: false
  4.6.6-R3:
    id: 4.6.6-R3
    rev: 800-63c-r4
    sectionNumber: 4.6.6
    ordinal: 3
    level: SHALL
    text: The RP SHALL disclose to the subscriber the purpose for collecting any additional attributes.
      These attributes SHALL be used solely for the stated purposes of the RP’s functionality. The
      transmission of additionally collected attributes SHALL be handled in accordance with Sec.
      3.10.1.
    textHash: 8de945cf7971
    source: prose
    seededBy: parser
    verified: false
  4.6.6-R4:
    id: 4.6.6-R4
    rev: 800-63c-r4
    sectionNumber: 4.6.6
    ordinal: 4
    level: SHALL
    text: The RP SHALL provide a secure and effective means of redress for the subscriber to update and
      remove these additionally collected attributes from the RP subscriber account. See Sec. 3.5.3
      for additional requirements and considerations for redress mechanisms.
    textHash: bb819d953fa6
    source: prose
    seededBy: parser
    verified: false
  4.6.6-R5:
    id: 4.6.6-R5
    rev: 800-63c-r4
    sectionNumber: 4.6.6
    ordinal: 5
    level: SHALL
    text: An RP SHALL disclose any additional attributes collected and their use as part of its System
      of Records Notice (SORN).
    textHash: 3d64d4e5b775
    source: prose
    seededBy: parser
    verified: false
  4.6.7-R1:
    id: 4.6.7-R1
    rev: 800-63c-r4
    sectionNumber: 4.6.7
    ordinal: 1
    level: MAY
    text: If an RP is using a just-in-time provisioning mechanism, the RP only learns of the existence
      of a subscriber account when that account is first used at the RP. If the IdP does not inform
      the RP of terminated subscriber accounts using shared signaling (see Sec. 4.8), an RP could
      accumulate RP subscriber accounts that are no longer accessible from the IdP. This poses a
      risk to the RP for holding personal information in the RP subscriber accounts and providing
      potentially exploitable accounts for an attacker to target. In such circumstances, the RP MAY
      employ a time-based mechanism to identify RP subscriber accounts for termination that have not
      been accessed after a period of time that is tailored to the usage patterns of the
      application. For example, an RP that is usually accessed on a weekly basis could set a timeout
      of 120 days since last access at the RP to mark the RP subscriber account for termination. An
      RP that expects longer gaps between access (e.g., a service used annually) should have a much
      longer time frame for time-based termination, such as five years.
    textHash: 1f453aaa6659
    source: prose
    seededBy: parser
    verified: false
  4.6.7-R2:
    id: 4.6.7-R2
    rev: 800-63c-r4
    sectionNumber: 4.6.7
    ordinal: 2
    level: SHALL
    text: When processing an inactive account, the RP SHALL provide sufficient notice to the subscriber
      about the pending termination of the account and provide the subscriber with an option to
      re-activate the account prior to its scheduled termination. Upon termination, the RP SHALL
      remove all personal information associated with the RP subscriber account in accordance with
      Sec. 3.11.3.
    textHash: dadc47496383
    source: prose
    seededBy: parser
    verified: false
  4.7-R1:
    id: 4.7-R1
    rev: 800-63c-r4
    sectionNumber: "4.7"
    ordinal: 1
    level: MAY
    text: The IdP terminating the subscriber’s session at the IdP will not necessarily terminate any
      sessions that subscriber might have at downstream RPs. The RP and IdP MAY communicate
      end-session events to each other if supported by the federation protocol or through shared
      signaling (see Sec. 4.8).
    textHash: 06b0e0d61363
    source: prose
    seededBy: parser
    verified: false
  4.7-R2:
    id: 4.7-R2
    rev: 800-63c-r4
    sectionNumber: "4.7"
    ordinal: 2
    level: SHALL
    text: At the time of a federated transaction request, the subscriber could have a pre-existing
      authenticated session at the IdP that MAY be used to generate an assertion to the RP. The IdP
      SHALL communicate to the RP any information that the IdP has regarding the recency of the
      subscriber’s latest authentication event at the IdP, and the RP MAY use this information to
      make authorization and access decisions. Depending on the capabilities of the federation
      protocol in use, the IdP SHOULD allow the RP to request that the subscriber provide a fresh
      authentication at the IdP, such as requesting a maximum time since the subscriber’s last
      authentication event. For example, suppose that the subscriber authenticates at the IdP for
      one transaction. The subscriber then starts a federation transaction at the RP 30 minutes
      later. Depending on xAL requirements, the subscriber’s existing session at the IdP can be used
      to avoid prompting the subscriber for their authenticators. The resulting assertion to the RP
      will indicate that the last time the subscriber authenticated to the RP was 30 minutes in the
      past. The RP can then use this information to determine whether this is reasonable for the
      RP’s needs. If the authentication time is not sufficient for the RP, the RP can request the
      IdP to prompt the subscriber for a fresh authentication event.
    textHash: 3e4e37f385d6
    source: prose
    seededBy: parser
    verified: false
  4.7-R3:
