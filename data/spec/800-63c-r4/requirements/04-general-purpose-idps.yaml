    textHash: 6df483a17196
    source: prose
    seededBy: parser
    verified: false
  4.8-R1:
    id: 4.8-R1
    rev: 800-63c-r4
    sectionNumber: "4.8"
    ordinal: 1
    level: SHALL_NOT
    text: In some environments, it is useful for the IdP and RP to send information to each other
      outside of the federation transaction. These signals can communicate important changes in
      state between parties that would not otherwise be known, such as suspected fraud or an account
      status change. Shared signaling SHALL be limited to the allowable functions of the identity
      process, as discussed in Sec. 3.10.1. All uses of shared signaling SHALL be documented in the
      trust agreement and made available to the authorized party stipulated by the trust agreement.
      This documentation SHALL include the events under which a signal is sent, the type of
      information included in such a signal (including any personal information), any additional
      parameters sent with the signal, and the expected processing of a received signal. The use of
      shared signaling SHALL be subject to privacy review under the trust agreement. Shared signals
      SHALL NOT include personal information except what is necessary to identify the subscriber
      account in question (e.g., an account identifier or attributes that can be correlated by the
      receiving party).
    textHash: 1edd6eb19411
    source: prose
