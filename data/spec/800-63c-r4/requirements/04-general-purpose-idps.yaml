    rev: 800-63c-r4
    sectionNumber: 4.11.2
    ordinal: 4
    level: SHALL
    text: With general-purpose IdPs, it is common for front-channel communications to be accomplished
      using HTTP redirects, where the contents of the assertion are made available as part of an
      HTTP request URL. Due to the nature of the HTTP ecosystem, these request URLs are sometimes
      available in unexpected places, such as access logs, web proxies, and browser histories. These
      artifacts tend to live on long past the federation transaction and are available in other
      contexts, which increases the attack surface for reading the assertion. As a consequence, an
      IdP that uses HTTP redirects for the front-channel presentation of assertions SHALL encrypt
      all personal information in the assertion, as discussed in Sec. 3.13.3. Other front-channel
      presentation mechanisms that do not share these characteristics (e.g., HTTP form-post binding,
      application-specific URLs) SHOULD encrypt all personal information in the assertion.
