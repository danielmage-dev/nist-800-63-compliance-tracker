    verified: false
  4.7-R4:
    id: 4.7-R4
    rev: 800-63c-r4
    sectionNumber: "4.7"
    ordinal: 4
    level: MAY
    text: The RP MAY terminate its authenticated session with the subscriber or restrict access to the
      RP’s functions if the assertion, authentication event, or attributes do not meet the RP’s
      requirements. For example, if an RP is configured to allow access to certain high-risk
      functionality only if the federation transaction was at FAL3, but the incoming assertion only
      meets the requirements for FAL2, the RP could decide to deny access to the high-risk
      functionality while allowing access to a lower risk functionality, or the RP could choose to
