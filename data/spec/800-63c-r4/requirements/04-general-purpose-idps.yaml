    rev: 800-63c-r4
    sectionNumber: "4.7"
    ordinal: 3
    level: SHALL_NOT
    text: If an RP is granted access to an identity API at the same that time the RP receives an
      assertion, the lifetime of the access to the identity API is independent of the lifetime of
      the assertion. As a consequence, the RP’s ability to successfully fetch additional attributes
      through an identity API SHALL NOT be used to establish or extend a session at the RP.
      Likewise, the inability to access an identity API SHOULD NOT be used to end the session at the
      RP.
    textHash: cefee18524bb
