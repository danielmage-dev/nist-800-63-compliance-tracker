    sectionNumber: 4.11.1
    ordinal: 1
    level: SHALL
    text: In the back-channel presentation model shown in Fig. 11, the subscriber is given an assertion
      reference to present to the RP, generally through the front channel. The assertion reference
      itself contains no information about the subscriber and SHALL be resistant to tampering and
      fabrication by an attacker. The RP presents the assertion reference to the IdP to fetch the
      assertion. Methods for achieving this vary based on the federation protocol in use. In the
      authorization code flow and some forms of the hybrid flow of [OIDC], the assertion (i.e., the
      ID Token) is presented in the back channel in exchange for the assertion reference (i.e., the
      authorization code). In the artifact binding profile of [SAML-Bindings], the SAML assertion is
      presented in the back channel.
