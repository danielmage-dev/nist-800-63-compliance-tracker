  3.16.2-R3:
    id: 3.16.2-R3
    rev: 800-63c-r4
    sectionNumber: 3.16.2
    ordinal: 3
    level: SHALL
    text: An RP MAY allow a subscriber to bind multiple subscriber-provided authenticators at FAL3. If
      this is the case, and the RP subscriber account has one or more existing bound authenticators,
      the binding ceremony makes use of one of the subscriber’s existing bound authenticators to
      reach FAL3. During the initial authentication step of the binding ceremony, the RP SHALL
      request authentication with an existing bound authenticator to reach FAL3. Once this
      authentication is complete and the binding ceremony session is established, the RP SHALL
      request authentication with the new authenticator and associate it with the RP subscriber
      account as a bound authenticator. The RP completes the binding ceremony by requesting a new
      assertion at FAL3.
    textHash: c02466580a74
    source: prose
    seededBy: parser
    verified: false
  3.16.2-R4:
    id: 3.16.2-R4
    rev: 800-63c-r4
    sectionNumber: 3.16.2
    ordinal: 4
    level: SHALL_NOT
    text: In addition to an RP determining that a bound authenticator is no longer viable, a subscriber
      could choose to stop using a bound authenticator for a variety of reasons, such as the
      authenticator being lost, compromised, or no longer usable due to technology and platform
      changes. In such cases, an RP MAY allow a subscriber to remove a subscriber-provided bound
      authenticator from their RP subscriber account, thereby removing the ability to use that
      authenticator for FAL3 sessions. When a bound authenticator is removed, the RP SHALL terminate
      all current FAL3 sessions for the subscriber and SHALL require reauthentication of the
      subscriber from the IdP at FAL3. The RP SHALL NOT prompt the subscriber to authenticate with
      the authenticator being removed, since the subscriber will often not have access to the
      authenticator in question during the unbinding process, particularly if the authenticator is
      lost or compromised. If all bound authenticators are removed, the subscriber will no longer be
      able to reach FAL3 until a new bound authenticator is added to the RP subscriber account. This
      situation poses similar risks to account recovery at the RP.
    textHash: 6ccb2b4a44b9
