    sectionNumber: "3.10"
    ordinal: 1
    level: SHOULD
    text: If the same subscriber account is asserted to multiple RPs, and those RPs communicate with
      each other, the colluding RPs could track a subscriber’s activity across multiple applications
      and security domains. The IdP SHOULD employ technical measures (e.g., the use of pairwise
      pseudonymous identifiers described in Sec. 3.4.1, privacy-enhancing cryptographic protocols)
      to provide disassociability and discourage subscriber activity tracking and profiling between
      RPs. When determining such measures, the IdP SHOULD apply relevant guidelines and standards,
      such as the NIST Privacy Framework [NIST-Privacy].
