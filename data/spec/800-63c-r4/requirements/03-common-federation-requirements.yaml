    rev: 800-63c-r4
    sectionNumber: "3.11"
    ordinal: 1
    level: SHALL
    text: IdPs and CSPs SHALL employ appropriately tailored security controls from at least the moderate
      baseline security controls defined in [SP800-53] or an equivalent federal (e.g., [FEDRAMP]) or
      industry standard that the organization has determined for the information systems,
      applications, and online services that these guidelines are used to protect. RPs SHALL employ
      appropriately tailored security controls from at least the low baseline security controls
      defined in [SP800-53] or an equivalent federal (e.g., [FEDRAMP]) or industry standard that the
      organization has determined for the information systems, applications, and online services
      that these guidelines are used to protect. RPs that request or process personal information
      SHALL employ appropriately tailored security controls from at least the moderate baseline
      security controls defined in [SP800-53] or an equivalent federal (e.g., [FEDRAMP]) or industry
      standard. CSPs, IdPs, and RPs SHALL ensure that the minimum assurance-related controls for the
