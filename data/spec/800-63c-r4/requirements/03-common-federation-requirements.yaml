  3.12.3-R1:
    id: 3.12.3-R1
    rev: 800-63c-r4
    sectionNumber: 3.12.3
    ordinal: 1
    level: SHOULD
    text: Attributes about the subscriber, including profile information, MAY be provided to the RP
      through a protected API known as the identity API. The RP is granted limited access to the
      identity API during the federation transaction in concert with the assertion. For example, in
      OpenID Connect, the UserInfo Endpoint provides a standardized identity API for fetching
      attributes about the subscriber. This API is protected by an OAuth 2.0 Access Token, which is
      issued to the RP along with OpenID Connect’s assertion, the ID Token. Identity APIs SHOULD
      require sender-constrained access to ensure that identity information is only made available
      to authorized RPs.
    textHash: 958fa7804b9f
    source: prose
    seededBy: parser
    verified: false
  3.12.3-R2:
    id: 3.12.3-R2
    rev: 800-63c-r4
    sectionNumber: 3.12.3
    ordinal: 2
    level: SHALL_NOT
    text: All possible use of identity APIs, including which provisioning models are available through
      the API, SHALL be recorded and disclosed as part of the trust agreement. Access to the
      identity API SHALL be time-limited by the trust agreement. Access to the identity API SHOULD
      be limited to the duration of the federation transaction plus the time necessary to
      synchronize attributes, as discussed in Sec. 4.6.4. Since the time limitation is separate from
      the validity time window of the assertion and the lifetime of the authenticated session at the
      RP, access to an identity API by the RP without an associated valid assertion SHALL NOT be
      sufficient for the establishment of an authenticated session at the RP.
    textHash: 55d1c1ccf539
    source: prose
    seededBy: parser
    verified: false
  3.12.3-R3:
    id: 3.12.3-R3
    rev: 800-63c-r4
    sectionNumber: 3.12.3
    ordinal: 3
    level: SHALL
    text: A given identity API deployment is expected to be capable of providing attributes for all
      subscribers for whom the IdP can create assertions. However, when access to the identity API
      is granted within the context of a federation transaction, the attributes provided by an
      identity API SHALL be associated with only the single subscriber identified in the associated
      assertion. If the identity API is hosted by the IdP, the returned attributes SHALL include the
      subject identifier for the subscriber. This allows the RP to positively correlate the
      assertion’s subject to the returned attributes. When access to an identity API is provided as
      part of pre-provisioning RP subscriber accounts (see Sec. 4.6.3), the RP is usually granted
      blanket access to the identity API outside of the context of the federation transaction, and
      these requirements do not apply. For pre-provisioning use cases, the privacy considerations
