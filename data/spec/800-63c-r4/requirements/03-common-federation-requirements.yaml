  3.11.3-R2:
    id: 3.11.3-R2
    rev: 800-63c-r4
    sectionNumber: 3.11.3
    ordinal: 2
    level: SHOULD
    text: When an RP subscriber account can no longer be accessed by a subscriber (e.g., when there are
      no federated identifiers associated with the account and no alternate means of
      authentication), the RP SHOULD terminate the RP subscriber account. In particular, if an RP
      supports account linking (see Sec. 3.8.1) or alternative authenticators (see Sec. 3.8.3), the
