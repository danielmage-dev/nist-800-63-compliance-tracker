      the RP subscriber account, as shown in Fig. 5. The RP SHALL first establish an authenticated
      session using federation with an assertion that meets all the other requirements of FAL3,
      including an indication that the assertion is intended for use at FAL3 with a bound
      authenticator (e.g., the assertion contains an authentication class reference or a Vectors of
      Trust [RFC8485] value indicating this). The subscriber SHALL immediately be prompted to
      present and authenticate with the proposed authenticator. Upon successful presentation of the
      authenticator, the RP SHALL store a unique identifier for the authenticator (such as its
      public key) and associate this with the RP subscriber account that is associated with the
      federated identifier. If the subscriber fails to successfully authenticate to the RP using an
      appropriate authenticator, the binding ceremony fails. The binding ceremony session SHALL have
      a timeout of five minutes or less and SHALL NOT be used as an authenticated session for any
      other purpose, as described in Sec. 3.9. Upon successful completion of the binding ceremony,
      the RP SHALL immediately request a new assertion from the IdP at FAL3. Upon receiving the new
      assertion, the RP SHALL prompt the subscriber for the newly bound authenticator and SHALL
      validate the authenticator output.
