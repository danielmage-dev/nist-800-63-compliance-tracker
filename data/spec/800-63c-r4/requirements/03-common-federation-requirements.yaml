chapter: "3"
rev: 800-63c-r4
requirements:
  3.3.3-R1:
    id: 3.3.3-R1
    rev: 800-63c-r4
    sectionNumber: 3.3.3
    ordinal: 1
    level: SHALL
    text: In some architectures, the IdP and RP do not communicate directly with each other. A
      federation proxy acts as an intermediary between the IdP and RP for all communication in the
      federation protocol. The proxy functions as an RP on the upstream side and an IdP on the
      downstream side, as shown in Fig. 1. When communicating through a proxy, the upstream IdP and
      downstream RP communicate with the proxy using a standard federation protocol, and the
      subscriber takes part in two separate federation transactions. As a consequence, all normative
      requirements that apply to IdPs and RPs SHALL apply to proxies in their respective roles on
      each side. Additionally, a proxy can act as an upstream IdP to a downstream proxy in a
      chaining scenario.
    textHash: d117c6974287
    source: prose
    seededBy: parser
    verified: false
  3.3.3-R2:
    id: 3.3.3-R2
    rev: 800-63c-r4
    sectionNumber: 3.3.3
    ordinal: 2
    level: SHALL
    text: The federated identifier (see Sec. 3.4) of an assertion from a proxy SHALL indicate the proxy
      as the issuer of the assertion.
    textHash: 83f1dc9a4fba
    source: prose
    seededBy: parser
    verified: false
  3.3.3-R3:
    id: 3.3.3-R3
    rev: 800-63c-r4
    sectionNumber: 3.3.3
    ordinal: 3
    level: SHALL
    text: The FAL of the connection between the proxy and the downstream RP is considered to be the
      lowest FAL along the entire path, and the proxy SHALL accurately represent this to the
      downstream RP. For example, if the connection between the upstream IdP and the proxy is FAL1
      and the connection between the proxy and the downstream RP otherwise meets the requirements of
      FAL2, the connection between the proxy and the downstream RP is still considered FAL1.
      Likewise, if the connection between the upstream IdP and the proxy is FAL2 and the connection
      between the proxy and the downstream RP is only FAL1, the overall connection through the proxy
      is considered FAL1.
    textHash: 4dbdd9ae9abc
    source: prose
    seededBy: parser
    verified: false
  3.4-R1:
    id: 3.4-R1
    rev: 800-63c-r4
    sectionNumber: "3.4"
    ordinal: 1
    level: SHALL
    text: When federated identifiers are used, the federated identifier SHALL be unique to that
      subscriber. Federated identifiers SHALL be associated with a single subscriber at the RP.
    textHash: 0f1b750cc2f2
    source: prose
    seededBy: parser
    verified: false
  3.4.1.1-R1:
    id: 3.4.1.1-R1
    rev: 800-63c-r4
    sectionNumber: 3.4.1.1
    ordinal: 1
    level: SHALL
    text: When using pairwise pseudonymous identifiers within the assertions generated by the IdP for
      the RP, the IdP SHALL generate a different federated identifier for each RP (see Sec. 3.4.1.2)
      or set of RPs (see Sec. 3.4.1.3).
    textHash: b0cc05fb31b4
    source: prose
    seededBy: parser
    verified: false
  3.4.1.1-R2:
    id: 3.4.1.1-R2
    rev: 800-63c-r4
    sectionNumber: 3.4.1.1
    ordinal: 2
    level: SHALL
    text: Some identity attributes such as names, physical addresses, phone numbers, email addresses,
      and others can be used to identify a subscriber outside of a federation transaction. When PPIs
      are used alongside these kinds of identifying attributes, it may still be possible for
      multiple colluding RPs to re-identify a subscriber by correlation across systems. For example,
      if two independent RPs each see the same subscriber identified with a different PPI, the RPs
      could still determine that the subscriber is the same person by comparing the name, email
      address, physical address, or other identifying attributes carried alongside the PPI in the
      respective assertions. If PPIs are used alongside identifying attributes, RPs SHALL establish
      privacy policies, processes, and procedures to prevent the correlation of subscriber data
      consistent with applicable legal and regulatory requirements.
    textHash: b631e6653d80
    source: prose
    seededBy: parser
    verified: false
  3.4.1.1-R3:
    id: 3.4.1.1-R3
    rev: 800-63c-r4
    sectionNumber: 3.4.1.1
    ordinal: 3
    level: SHALL
    text: In a proxied federation model (see Sec. 3.3.3), the upstream IdP may not be able to generate a
      PPI for the downstream RP, since the proxy could blind the IdP from knowing which RP is being
      accessed by the subscriber. In such situations, the PPI is generally established between the
      IdP and the federation proxy. Acting as an IdP, the proxy can provide a PPI to the downstream
      RP. Depending on the protocol, the federation proxy may need to map the PPI back to the
      associated identifiers from upstream IdPs in order to allow the identity protocol to function.
      In such cases, the proxy will be able to track and determine which PPIs represent the same
      subscriber at different RPs. The mapping of a PPI to other identifiers is considered
      subscriber information and SHALL be treated in accordance with the requirements in Sec.
      3.10.1.
    textHash: 8ee2da0467e2
    source: prose
    seededBy: parser
    verified: false
  3.4.1.2-R1:
    id: 3.4.1.2-R1
    rev: 800-63c-r4
    sectionNumber: 3.4.1.2
    ordinal: 1
    level: SHALL
    text: The PPI SHALL contain no identifying information about the subscriber (e.g., username, email
      address, employee number). The PPI SHALL be difficult to guess by a party with access to
      information about the subscriber and SHALL provide sufficient entropy as to be unguessable by
      an attacker. PPIs can be generated randomly and assigned to subscribers by the IdP or derived
      from other subscriber information if the derivation is done in an irreversible, unguessable
      manner (e.g., using a keyed hash function with a secret key, as discussed in [SP800-131A]).
    textHash: 494242d20df8
    source: prose
    seededBy: parser
    verified: false
  3.4.1.2-R2:
    id: 3.4.1.2-R2
    rev: 800-63c-r4
    sectionNumber: 3.4.1.2
    ordinal: 2
    level: SHALL
    text: Unless the PPI is designated as shared by the trust agreement, the PPI SHALL be disclosed to
      only a single RP.
    textHash: ac2b576e08dc
    source: prose
    seededBy: parser
    verified: false
  3.4.1.3-R1:
    id: 3.4.1.3-R1
    rev: 800-63c-r4
    sectionNumber: 3.4.1.3
    ordinal: 1
    level: SHALL
    text: The trust agreement stipulates a shared PPI for a specific set of RPs.
    textHash: 645dc5ea079e
    context: "The same shared PPI SHALL be used for a specific set of RPs if all of the following
      criteria are met:"
    source: prose
    seededBy: parser
    verified: false
  3.4.1.3-R2:
    id: 3.4.1.3-R2
    rev: 800-63c-r4
    sectionNumber: 3.4.1.3
    ordinal: 2
    level: SHALL
    text: The authorized party consents to and is notified of the use of a shared PPI.
    textHash: 2d761ab915d5
    context: "The same shared PPI SHALL be used for a specific set of RPs if all of the following
      criteria are met:"
    source: prose
    seededBy: parser
    verified: false
  3.4.1.3-R3:
    id: 3.4.1.3-R3
    rev: 800-63c-r4
    sectionNumber: 3.4.1.3
    ordinal: 3
    level: SHALL
    text: Those RPs have a demonstrable relationship that justifies an operational need for the
      correlation, such as a shared security domain or shared legal ownership.
    textHash: 3525ead8441a
    context: "The same shared PPI SHALL be used for a specific set of RPs if all of the following
      criteria are met:"
    source: prose
    seededBy: parser
    verified: false
  3.4.1.3-R4:
    id: 3.4.1.3-R4
    rev: 800-63c-r4
    sectionNumber: 3.4.1.3
    ordinal: 4
    level: SHALL
    text: All RPs in the set of a shared PPI consent to being correlated in such a manner (i.e., one RP
      cannot request to have another RP’s PPI without that other RP’s knowledge and consent).
    textHash: 7fbd1d773170
    context: "The same shared PPI SHALL be used for a specific set of RPs if all of the following
      criteria are met:"
    source: prose
    seededBy: parser
    verified: false
  3.4.1.3-R5:
    id: 3.4.1.3-R5
    rev: 800-63c-r4
    sectionNumber: 3.4.1.3
    ordinal: 5
    level: SHALL
    text: The RPs SHALL conduct a privacy risk assessment to consider the privacy risks associated with
      requesting a shared PPI. See Sec. 7.2 for further privacy considerations.
    textHash: 91e2f9931115
    source: prose
    seededBy: parser
    verified: false
  3.4.1.3-R6:
    id: 3.4.1.3-R6
    rev: 800-63c-r4
    sectionNumber: 3.4.1.3
    ordinal: 6
    level: SHALL
    text: The IdP SHALL ensure that only intended RPs are included in the set. Otherwise, a rogue RP
      could learn the shared PPI for a set of RPs by fraudulently posing as part of that set.
    textHash: 895360c348b1
    source: prose
    seededBy: parser
    verified: false
  3.5-R1:
    id: 3.5-R1
    rev: 800-63c-r4
    sectionNumber: "3.5"
    ordinal: 1
    level: SHALL
    text: All federation transactions SHALL be governed by the terms of one or more trust agreements
      between the applicable parties. Different relationships MAY be established at different times
      and by different processes. For example, a CSP and IdP entering into a trust agreement is
      generally separate from an RP and IdP entering into a trust agreement, but the overall set of
      terms for a federation transaction under these parties is drawn from both sets of
      relationships.
    textHash: 98d9fc582940
    source: prose
    seededBy: parser
    verified: false
  3.5-R2:
    id: 3.5-R2
    rev: 800-63c-r4
    sectionNumber: "3.5"
    ordinal: 2
    level: SHALL
    text: Trust agreements establish the terms for federation transactions between the parties they
      affect, including the allowed xALs and the intended purposes of identity attributes exchanged
      in the federation transaction. The trust agreement SHALL establish customer experience
      requirements for the federation transaction, as discussed in Sec. 8. The trust agreement SHALL
      include details of the proofing process used at the CSP for subscribers covered by the trust
      agreement, including any compensating controls and exception handling processes.
    textHash: daf69bc8f61f
    source: prose
    seededBy: parser
    verified: false
  3.5-R3:
    id: 3.5-R3
    rev: 800-63c-r4
    sectionNumber: "3.5"
    ordinal: 3
    level: SHALL
    text: All trust agreements SHALL define a specific population of subscriber accounts to which the
      agreement is applicable. The exact means of defining this population are out of scope for this
      document. In many cases, the population is defined as the full set of subscriber accounts that
      the CSP manages and makes available through an IdP. In other cases, the population is a
      demarcated subset of accounts that are available through an IdP. It is also possible for an RP
      to have a distinct trust agreement established with an IdP for a single subscriber account,
      such as in a subscriber-driven trust agreement.
    textHash: 734681af2a91
    source: prose
    seededBy: parser
    verified: false
  3.5-R4:
    id: 3.5-R4
    rev: 800-63c-r4
    sectionNumber: "3.5"
    ordinal: 4
    level: SHALL
    text: During the course of a single federation transaction, it is important for the policies and
      expectations of all parties to be unambiguous. Therefore, there SHOULD only be one set of
      trust agreements in effect for a given transaction. This will usually be determined by the
      unique combination of CSP, IdP, and RP that are participating in the transaction. However,
      these agreements could vary in other ways, such as different populations of subscribers being
      governed by different trust agreements. If more than one trust agreement is applicable to a
      federation transaction, the combined set of terms of all applicable trust agreements SHALL
      constitute the effective trust agreement of that transaction.
    textHash: 6c05c53faae9
    source: prose
    seededBy: parser
    verified: false
  3.5-R5:
    id: 3.5-R5
    rev: 800-63c-r4
    sectionNumber: "3.5"
    ordinal: 5
    level: SHALL
    text: Trust agreements SHALL establish terms regarding expected and acceptable IALs, AALs, and FALs
      in connection with the federated relationship.
    textHash: c5397e815905
    source: prose
    seededBy: parser
    verified: false
  3.5-R6:
    id: 3.5-R6
    rev: 800-63c-r4
    sectionNumber: "3.5"
    ordinal: 6
    level: SHALL
    text: Trust agreements SHALL define necessary mechanisms and materials to coordinate redress and
      issues between the different participants in the federation, as discussed in Sec. 3.5.3.
    textHash: 2564dd7898ae
    source: prose
    seededBy: parser
    verified: false
  3.5-R7:
    id: 3.5-R7
    rev: 800-63c-r4
    sectionNumber: "3.5"
    ordinal: 7
    level: SHALL
    text: Trust agreements SHALL declare the data retention policies expected of all parties.
    textHash: 0e1446f0125f
    source: prose
    seededBy: parser
    verified: false
  3.5-R8:
    id: 3.5-R8
    rev: 800-63c-r4
    sectionNumber: "3.5"
    ordinal: 8
    level: SHALL
    text: Even though subscribers are not generally directly involved in the trust agreement’s terms,
      subscribers are affected by the terms of the trust agreement and the resulting federation
      transactions. As such, the relevant terms of the trust agreement SHALL be made available to
      subscribers in clear and understandable language. The terms of the trust agreement SHALL be
      reviewed by all parties (e.g., the CSP, IdP, RP, or a federation authority) that are
      responsible for informing the subscriber of the terms of the trust agreement before the
      disclosure to the subscriber occurs in order to avoid revealing sensitive security
      information.
    textHash: 19752e7fb359
    source: prose
    seededBy: parser
    verified: false
  3.5.2-R1:
    id: 3.5.2-R1
    rev: 800-63c-r4
    sectionNumber: 3.5.2
    ordinal: 1
    level: SHALL
    text: The trust agreement SHALL enumerate the required practices for vetting all parties and SHALL
      indicate the party or parties that are responsible for performing the vetting process.
    textHash: 73acd2492c14
    source: prose
    seededBy: parser
    verified: false
  3.5.2-R2:
    id: 3.5.2-R2
    rev: 800-63c-r4
    sectionNumber: 3.5.2
    ordinal: 2
    level: SHALL
    text: CSPs identity proof subscriber accounts in accordance with [SP800-63A].
    textHash: 4cba0edbb94a
    context: "At a minimum, the vetting of CSPs, IdPs, and RPs SHALL establish that:"
    source: prose
    seededBy: parser
    verified: false
  3.5.2-R3:
    id: 3.5.2-R3
    rev: 800-63c-r4
    sectionNumber: 3.5.2
    ordinal: 3
    level: SHALL
    text: CSPs onboard subscriber accounts (including attributes, derived attribute values, and
      attribute bundles) to IdPs in a secure fashion in adherence to the requirements in Sec. 4.1 or
      Sec. 5.1, as applicable.
    textHash: c2e63bae49d0
    context: "At a minimum, the vetting of CSPs, IdPs, and RPs SHALL establish that:"
    source: prose
    seededBy: parser
    verified: false
  3.5.2-R4:
    id: 3.5.2-R4
    rev: 800-63c-r4
    sectionNumber: 3.5.2
    ordinal: 4
    level: SHALL
    text: The authenticators used to authenticate the subscriber at the IdP (during a federation
      transaction) or CSP (while issuing attribute bundles to a subscriber-controlled wallet) are
      used in accordance with [SP800-63B].
    textHash: 82c8f4e838f5
    context: "At a minimum, the vetting of CSPs, IdPs, and RPs SHALL establish that:"
    source: prose
    seededBy: parser
    verified: false
  3.5.2-R5:
    id: 3.5.2-R5
    rev: 800-63c-r4
    sectionNumber: 3.5.2
    ordinal: 5
    level: SHALL
    text: The assertions generated by IdPs adhere to the requirements in Sec. 4.9 or Sec. 5.8, as
      applicable.
    textHash: 205e1b927a1f
    context: "At a minimum, the vetting of CSPs, IdPs, and RPs SHALL establish that:"
    source: prose
    seededBy: parser
    verified: false
  3.5.2-R6:
    id: 3.5.2-R6
    rev: 800-63c-r4
    sectionNumber: 3.5.2
    ordinal: 6
    level: SHALL
    text: RPs adhere to requirements for handling subscriber attribute data, such as retention,
      aggregation, deletion, and disclosure to third parties.
    textHash: 74494bae95ee
    context: "At a minimum, the vetting of CSPs, IdPs, and RPs SHALL establish that:"
    source: prose
    seededBy: parser
    verified: false
  3.5.2-R7:
    id: 3.5.2-R7
    rev: 800-63c-r4
    sectionNumber: 3.5.2
    ordinal: 7
    level: SHALL
    text: RP and IdP systems use agreed-upon profiles of federation protocols, as specified by the
      federation authority.
    textHash: 45578e4b7e50
    context: "At a minimum, the vetting of CSPs, IdPs, and RPs SHALL establish that:"
    source: prose
    seededBy: parser
    verified: false
  3.5.2-R8:
    id: 3.5.2-R8
    rev: 800-63c-r4
    sectionNumber: 3.5.2
    ordinal: 8
    level: MAY
    text: The federation authority MAY provide a programmatic means for parties under the trust
      agreement to verify the membership of other parties in the trust agreement. For example, a
      federation authority could provide a discovery API that provides the vetted capabilities of an
      IdP for providing identities to RPs within the system. Alternatively, the federation authority
      could provide a signed attestation for RPs to present to IdPs during a registration step.
    textHash: 09a08e686b88
    source: prose
    seededBy: parser
    verified: false
  3.5.2-R9:
    id: 3.5.2-R9
    rev: 800-63c-r4
    sectionNumber: 3.5.2
    ordinal: 9
    level: SHALL
    text: Federation authorities SHALL periodically reevaluate members for compliance with terms
      disclosed in the trust agreement.
    textHash: be396731ee62
    source: prose
    seededBy: parser
    verified: false
  3.5.2-R10:
    id: 3.5.2-R10
    rev: 800-63c-r4
    sectionNumber: 3.5.2
    ordinal: 10
    level: MAY
    text: A multilateral trust agreement MAY establish trust based on other trust agreements that are
      managed by other entities by creating an interfederation agreement. For example, IdP1 has been
      vetted under a multilateral agreement with federation authority A1, and RP2 has been vetted
      under a multilateral agreement with federation authority A2. In order to facilitate connection
      between IdP1 and RP2, a new federation authority A3 can provide a multilateral agreement that
      accepts IdPs from A1 and RPs from A2. If IdP1 and RP2 accept the authority of A3, the
      federation connection can continue under the auspices of this interfederation agreement.
    textHash: 08c58c6da83a
    source: prose
    seededBy: parser
    verified: false
  3.5.3-R1:
    id: 3.5.3-R1
    rev: 800-63c-r4
    sectionNumber: 3.5.3
    ordinal: 1
    level: SHALL
    text: As the recipient of a subscriber’s identity attributes, the RP is the subscriber’s primary
      view into the federated system. In some instances, the subscriber may be unaware that an IdP
      is involved with their use of the RP. Therefore, it falls to the RP to provide the subscriber
      with a clear and accessible method of contacting the RP to request redress. For matters that
      involve the RP subscriber account (including any attributes stored in the account), RP
      functionality, bound authenticators, RP allowlists, and other items under the RP’s control,
      the RP SHALL provide a clear and accessible means of redress to the subscriber. For matters
      that involve the IdP or CSP, the RP SHALL provide the subscriber with a means of initiating
      the redress process with the IdP or CSP, as appropriate.
    textHash: a2af92cc12f1
    source: prose
    seededBy: parser
    verified: false
  3.5.3-R2:
    id: 3.5.3-R2
    rev: 800-63c-r4
    sectionNumber: 3.5.3
    ordinal: 2
    level: SHALL
    text: For matters that involve the use of the subscriber account in federation transactions,
      including attribute values and derived attribute values made available over federation
      transactions, IdP functionality, holder-of-key authenticators, IdP allowlists, and other items
      in the IdP’s control, the IdP SHALL provide a clear and accessible means of redress to the
      subscriber. For matters that also involve a particular RP, the IdP SHALL provide the
      subscriber with a means of initiating the redress process with the RP. For matters that
      involve a subscriber account that has been made available to the IdP, the IdP SHALL provide
      the subscriber with a means of initiating the redress process with the CSP.
    textHash: 12f1d08c4363
    source: prose
    seededBy: parser
    verified: false
  3.5.3-R3:
    id: 3.5.3-R3
    rev: 800-63c-r4
    sectionNumber: 3.5.3
    ordinal: 3
    level: SHALL
    text: For matters that involve the subscriber account, including identity attributes and
      authenticators in the subscriber account, the CSP SHALL provide the subscriber with a clear
      and accessible means of redress.
    textHash: 466f873c97a4
    source: prose
    seededBy: parser
    verified: false
  3.6-R1:
    id: 3.6-R1
    rev: 800-63c-r4
    sectionNumber: "3.6"
    ordinal: 1
    level: SHALL
    text: The discovery and registration processes SHALL be established in a secure fashion, as defined
      by the trust agreement that governs the federation transaction. In many cases, the identifier
      is associated with a trusted source of cryptographic key material and not the key material
      itself. For example, a URL hosted by an IdP can serve the public signing keys for that IdP.
      Even if the RP is manually configured with this association, the RP can fetch the actual
      cryptographic key material at runtime. Protocols that require the transfer of cryptographic
      key information SHALL use an authenticated protected channel to exchange the cryptographic key
      information needed to operate the federated relationship, including any shared secrets or
      public keys. Any symmetric keys used in this relationship SHALL be unique to a pair of
      federation participants.
    textHash: 9ac1836d1c11
    source: prose
    seededBy: parser
    verified: false
  3.6-R2:
    id: 3.6-R2
    rev: 800-63c-r4
    sectionNumber: "3.6"
    ordinal: 2
    level: MAY
    text: CSPs, IdPs (including subscriber-controlled wallets), and RPs MAY have multiple identifiers
      and cryptographic keys to serve different purposes within a trust agreement or different trust
      agreements. For example, an IdP could use one set of assertion signing keys for all FAL1 and
      FAL2 transactions and use a separately managed set of signing keys for FAL3 transactions that
      are stored in a higher security container.
    textHash: d1231cbc4255
    source: prose
    seededBy: parser
    verified: false
  3.6-R3:
    id: 3.6-R3
    rev: 800-63c-r4
    sectionNumber: "3.6"
    ordinal: 3
    level: SHALL_NOT
    text: When domain names, URIs, or other structured identifiers are used to identify parties,
      wildcards SHALL NOT be used. For example, if an RP is deployed at “www.example.com”,
      “service.example.com”, and “gateway.example.com”, then each of these identifiers would have to
      be registered for the RP. A wildcard of “*.example.com” cannot be used, as it would
      unintentionally allow access to “user.example.com” and “unknown.example.com” under the same RP
      identifier.
    textHash: f3eb8ba9223f
    source: prose
    seededBy: parser
    verified: false
  3.6.1-R1:
    id: 3.6.1-R1
    rev: 800-63c-r4
    sectionNumber: 3.6.1
    ordinal: 1
    level: SHALL
    text: Over time, it can be desirable or necessary to update the cryptographic key associated with a
      CSP, IdP, or RP. The allowable update process for any identifiers and cryptographic keys SHALL
      be defined by the trust agreement and SHALL be executed using an authenticated protected
      channel, as in the initial cryptographic key establishment.
    textHash: 016863fdee8b
    source: prose
    seededBy: parser
    verified: false
  3.6.2-R1:
    id: 3.6.2-R1
    rev: 800-63c-r4
    sectionNumber: 3.6.2
    ordinal: 1
    level: SHALL
    text: CSPs, IdPs (including subscriber-controlled wallets), and RPs SHALL store all signing keys,
      decryption keys, and symmetric keys in a secure fashion. Cryptographic key storage is subject
      to applicable [FIPS140] requirements, including applicable tamper resistance requirements.
    textHash: 0a9406bff3f6
    source: prose
    seededBy: parser
    verified: false
  3.6.2-R2:
    id: 3.6.2-R2
    rev: 800-63c-r4
    sectionNumber: 3.6.2
    ordinal: 2
    level: SHALL_NOT
    text: Some circumstances require the cryptographic keys to be stored in a non-exportable manner,
      such as reaching FAL3 with a subscriber-controlled wallet on a subscriber’s device (see Sec.
      5.4.1). To be considered non-exportable, key storage SHALL either be a separate piece of
      hardware or an embedded processor or execution environment, such as a secure element, trusted
      execution environment (TEE), or trusted platform module (TPM). These hardware modules or
      embedded processors are separate from a host processor, such as the CPU on a laptop or mobile
      device. Non-exportable key storage SHALL be designed to prohibit the export of the secret keys
      to the host processor and SHALL NOT be capable of being reprogrammed by the host processor to
      allow the secret keys to be extracted.
    textHash: 419939ad7407
    source: prose
    seededBy: parser
    verified: false
  3.6.3-R1:
