  3.12.2-R1:
    id: 3.12.2-R1
    rev: 800-63c-r4
    sectionNumber: 3.12.2
    ordinal: 1
    level: SHALL_NOT
    text: Derived attribute values increase the privacy of a system since they allow a more focused
