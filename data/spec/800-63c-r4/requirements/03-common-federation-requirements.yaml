  3.12.3.1-R1:
    id: 3.12.3.1-R1
    rev: 800-63c-r4
    sectionNumber: 3.12.3.1
    ordinal: 1
    level: MAY
    text: As the attributes returned by the external identity API are assumed to be independent of those
      returned directly from the IdP, the contents of the external Identity API MAY use different
      identifiers, formats, or schemas from those used by the IdP. In particular, an external
      identity API is not expected to use the same federated identifier as an IdP-hosted identity
      API. For example, an IdP could provide access to a subscriber’s medical license information.
      Instead of the IdP asserting the license status directly, the IdP provides the RP access to a
      record at a medical licensure agency that represents the subscriber. The federation protocol
      can enable this by allowing the IdP to provide a link to an API with the record that
      represents the subscriber as well as a credential that allows limited access to this API. The
      RP can then make a strong association between the subscriber and the medical license record,
      even though the license record will likely use a different identifier and would not otherwise
      be correlatable by the RP. The IdP remains responsible for providing this link to the RP.
