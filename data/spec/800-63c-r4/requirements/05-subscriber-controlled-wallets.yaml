chapter: "5"
rev: 800-63c-r4
requirements:
  5.1-R1:
    id: 5.1-R1
    rev: 800-63c-r4
    sectionNumber: "5.1"
    ordinal: 1
    level: SHALL
    text: The subscriber proves their identity to the CSP’s issuance functionality using the CSP’s
      identity proofing process or by authenticating to the subscriber account.
    textHash: 3e68650f3f09
    context: "When the CSP issues attribute bundles to the subscriber-controlled wallet, the process
      SHALL include the following steps:"
    source: prose
    seededBy: parser
    verified: false
  5.1-R2:
    id: 5.1-R2
    rev: 800-63c-r4
    sectionNumber: "5.1"
    ordinal: 2
    level: SHALL
    text: The subscriber activates the wallet using an activation factor, which might entail
      authenticating to a hosted wallet service.
    textHash: 3f12dd2e3428
    context: "When the CSP issues attribute bundles to the subscriber-controlled wallet, the process
      SHALL include the following steps:"
    source: prose
    seededBy: parser
    verified: false
  5.1-R3:
    id: 5.1-R3
    rev: 800-63c-r4
    sectionNumber: "5.1"
    ordinal: 3
    level: SHALL
    text: The wallet generates or chooses a signing key and corresponding verification key. The wallet
      proves possession of its signing key to the CSP.
    textHash: 3614f901cfb3
    context: "When the CSP issues attribute bundles to the subscriber-controlled wallet, the process
      SHALL include the following steps:"
    source: prose
    seededBy: parser
    verified: false
  5.1-R4:
    id: 5.1-R4
    rev: 800-63c-r4
    sectionNumber: "5.1"
    ordinal: 4
    level: SHALL
    text: The CSP creates one or more attribute bundles that include subscriber attributes and the
      wallet’s verification key (or a reference to that key).
    textHash: ad3a8a62cc57
    context: "When the CSP issues attribute bundles to the subscriber-controlled wallet, the process
      SHALL include the following steps:"
    source: prose
    seededBy: parser
    verified: false
  5.1-R5:
    id: 5.1-R5
    rev: 800-63c-r4
    sectionNumber: "5.1"
    ordinal: 5
    level: SHALL
    text: The wallet stores the attribute bundle for later presentation to RPs.
    textHash: 17b3bb50255f
    context: "When the CSP issues attribute bundles to the subscriber-controlled wallet, the process
      SHALL include the following steps:"
    source: prose
    seededBy: parser
    verified: false
  5.1-R6:
    id: 5.1-R6
    rev: 800-63c-r4
    sectionNumber: "5.1"
    ordinal: 6
    level: MAY
    text: The subscriber-controlled wallet MAY generate and use a different signing key and verification
      key for each issuance request with the CSP.
    textHash: ed52e4d8cbc8
    source: prose
    seededBy: parser
    verified: false
  5.1-R7:
    id: 5.1-R7
    rev: 800-63c-r4
    sectionNumber: "5.1"
    ordinal: 7
    level: SHALL
    text: The CSP SHALL create a unique attribute bundle for each requesting wallet and SHOULD create a
      unique attribute bundle for each request from an individual wallet.
    textHash: 802010058a55
    source: prose
    seededBy: parser
    verified: false
  5.1-R8:
    id: 5.1-R8
    rev: 800-63c-r4
    sectionNumber: "5.1"
    ordinal: 8
    level: SHALL
    text: Many subscriber-controlled wallets can carry attribute bundles from multiple CSPs
      simultaneously. The simultaneous presentation of attribute bundles from multiple CSPs in a
      single assertion is possible with some technologies. When this occurs, the assertion of
      multiple attribute bundles SHALL conform to the assertion requirements in this guideline.
    textHash: 580e4f731ae5
    source: prose
    seededBy: parser
    verified: false
  5.1.1-R1:
    id: 5.1.1-R1
    rev: 800-63c-r4
    sectionNumber: 5.1.1
    ordinal: 1
    level: SHALL
    text: The subscriber account is terminated, thereby rendering downstream federation actions invalid;
    textHash: e6bd1f45ffe0
    context: "The CSP SHALL provide a means of invalidating attribute bundles that are issued to a
      subscriber-controlled wallet. This process is used when:"
    source: prose
    seededBy: parser
    verified: false
  5.1.1-R2:
    id: 5.1.1-R2
    rev: 800-63c-r4
    sectionNumber: 5.1.1
    ordinal: 2
    level: SHALL
    text: The wallet needs to be terminated due to the device being lost, stolen, or compromised; or
    textHash: de9f0e4460a9
    context: "The CSP SHALL provide a means of invalidating attribute bundles that are issued to a
      subscriber-controlled wallet. This process is used when:"
    source: prose
    seededBy: parser
    verified: false
  5.1.1-R3:
    id: 5.1.1-R3
    rev: 800-63c-r4
    sectionNumber: 5.1.1
    ordinal: 3
    level: SHALL
    text: The attribute bundle is disclosed to an attacker or otherwise compromised.
    textHash: b508d3413954
    context: "The CSP SHALL provide a means of invalidating attribute bundles that are issued to a
      subscriber-controlled wallet. This process is used when:"
    source: prose
    seededBy: parser
    verified: false
  5.1.1-R4:
    id: 5.1.1-R4
    rev: 800-63c-r4
    sectionNumber: 5.1.1
    ordinal: 4
    level: SHALL
    text: To accomplish this, the CSP SHOULD issue attribute bundles with a limited time validity
      window. The CSP SHOULD provide a means to independently verify the status of attribute bundles
      (i.e., whether a specific bundle has been revoked by the CSP). If such a service is offered,
      the service SHALL be deployed in a privacy-preserving way such that the CSP is not alerted to
      the use of a specific attribute bundle at a specific RP.
    textHash: d8c73c829d29
    source: prose
    seededBy: parser
    verified: false
  5.3-R1:
    id: 5.3-R1
    rev: 800-63c-r4
    sectionNumber: "5.3"
    ordinal: 1
    level: SHALL
    text: The release of subscriber attributes SHALL be managed using a runtime decision managed by the
      wallet, as described in Sec. 4.6.1.3.
    textHash: f6a0221357a2
    source: prose
    seededBy: parser
    verified: false
  5.3-R2:
    id: 5.3-R2
    rev: 800-63c-r4
    sectionNumber: "5.3"
    ordinal: 2
    level: SHALL
    text: The authorized party SHALL be the subscriber.
    textHash: 102559e403a8
    source: prose
    seededBy: parser
    verified: false
  5.3-R3:
    id: 5.3-R3
    rev: 800-63c-r4
    sectionNumber: "5.3"
    ordinal: 3
    level: SHALL
    text: "The following terms SHALL be disclosed to the subscriber during the runtime decision:"
    textHash: 498f1ad57811
    source: prose
    seededBy: parser
    verified: false
