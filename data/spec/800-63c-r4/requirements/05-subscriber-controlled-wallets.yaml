    sectionNumber: 5.3.1
    ordinal: 14
    level: MAY
    text: Trust between RPs and CSPs MAY be accomplished in either a pre-established (see Sec. 4.3.1) or
      subscriber-driven fashion (see Sec. 4.3.2). For example, an RP could be statically configured
      to accept attribute bundles from only a specific set of CSPs for its purposes, or the RP could
      alternatively accept attribute bundles from any CSP by prompting the subscriber for consent at
      runtime. This trust relationship could also be made more explicit by the RP being provided a
      means of verifying CSP-approved subscriber-controlled wallet identifiers beyond the
      verification of the attribute bundle, such as a discovery service provided through a
      federation authority.
