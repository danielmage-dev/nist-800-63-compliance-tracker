    text: The RP SHALL protect itself against the injection of manufactured or captured assertions by
      using XSS and CSRF protection, rejecting assertions outside of the correct stage of a
      federation transaction, or other accepted techniques discussed in Sec. 3.11.1. When possible,
      subscriber-controlled wallets that run on a subscriber-controlled device SHOULD use platform
      APIs instead of HTTP redirects when delivering an assertion to the RP.
