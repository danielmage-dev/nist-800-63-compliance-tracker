    id: 5.3-R4
    rev: 800-63c-r4
    sectionNumber: "5.3"
    ordinal: 4
    level: MAY
    text: The xALs required by the RP MAY also be disclosed to the subscriber at runtime.
    textHash: 11a7b5e88474
    source: prose
    seededBy: parser
    verified: false
  5.3.1-R1:
