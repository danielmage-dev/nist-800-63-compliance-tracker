    level: SHALL
    text: The verification keys of a subscriber-controlled wallet on a hosted service do not meet the
      requirements for holder-of-key assertions on their own since the subscriber is not in control
      of the key material as they would be on a subscriber-controlled device. To reach FAL3,
      federation transactions with a subscriber-controlled wallet on a hosted service SHALL use
      either a holder-of-key assertion (see Sec. 3.15) or a bound authenticator (see Sec. 3.16). All
