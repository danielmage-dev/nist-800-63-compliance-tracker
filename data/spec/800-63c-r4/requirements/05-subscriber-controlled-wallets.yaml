    sectionNumber: 5.3.1
    ordinal: 1
    level: SHALL
    text: The set of subscriber attributes and derived attributes that the CSP makes available to
      wallets in attribute bundles
    textHash: 0390e326b7fc
    context: "Trust between the CSP and RP in subscriber-controlled wallet scenarios will not typically
      be bidirectional. In the general case, the RP trusts the CSP as the source of attribute
      bundles that are presented by subscriber-controlled wallets during a federation transaction,
      while the CSP is not expected to have direct knowledge of the RP. This trust relationship
      between the RP and CSP MAY be facilitated by a federation authority (see Sec. 3.5.2) that
      defines overarching trust agreements between members of an ecosystem representing RPs, CSPs,
      and subscriber-controlled wallets. Such trust agreements SHALL contain:"
    source: prose
