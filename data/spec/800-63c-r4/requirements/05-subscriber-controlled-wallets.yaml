  5.11-R1:
    id: 5.11-R1
    rev: 800-63c-r4
    sectionNumber: "5.11"
    ordinal: 1
    level: SHALL
    text: For many RPs that use wallet-based attribute bundles, the RP will use an account resolution
      process to link the information in the attribute bundle to a set of functionality at the RP,
      as discussed in Sec. 3.8.2. If the RP subscriber account is not ephemeral and a federated
      identifier is present, the RP SHOULD associate the federated identifier presented by the
      subscriber-controlled wallet with the RP subscriber account and use the federated identifier
      for future federated transactions with the same subscriber. If a federated identifier is not
      present (e.g., in the case of mDL), the RP will need to request the necessary attributes to
      resolve the subscriber to the RP subscriber account for each federated transaction. This
      attribute set SHALL be the minumum necessary to achieve accurate resolution. Linking to
      multiple federated identifiers SHALL be managed as discussed in Sec. 3.8.1.
    textHash: d534bde3202c
    source: prose
    seededBy: parser
    verified: false
