    level: MAY
    text: Parties that seek to federate MAY use a trusted third party to facilitate the discovery and
      registration processes if that trusted third party is identified in the trust agreement. For
      example, consider an ecosystem has a centralized service for managing discovery and
      registration. When an RP joins the ecosystem, it registers itself with the trusted service,
      downloads the CSP’s verification keys, and receives an identifier to use with wallets. When
      the CSP issues attribute bundles to the subscriber-controlled wallet, the
      subscriber-controlled wallet is informed where it can find the list of valid RP identifiers
      within the ecosystem. When the RP connects to the wallet, the wallet can verify the RP’s
      identifier without the RP having to register itself directly with the wallet. Likewise, the RP
