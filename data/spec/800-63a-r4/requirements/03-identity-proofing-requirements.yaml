    sectionNumber: "3.11"
    ordinal: 12
    level: SHALL
    text: Biometric verification technologies SHALL provide performance for applicants of different
      demographic types that is no more than 25 % worse than the performance for the overall
      population. For example, if the measured false non-match rate (FNMR) for the overall
      population is 0.006, the FNMR for a specific demographic group cannot exceed 0.0075.
      Similarly, if the false match rate (FMR) for the overall population is 0.0001, the FMR for
      each demographic group cannot exceed 0.000125. The biometric system SHALL be configured with a
      fixed threshold; it is not feasible to change the threshold for each demographic group.
