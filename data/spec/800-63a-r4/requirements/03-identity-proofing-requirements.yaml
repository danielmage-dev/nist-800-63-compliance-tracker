    rev: 800-63a-r4
    sectionNumber: "3.11"
    ordinal: 10
    level: SHALL
    text: A 1:N search of an applicant’s collected biometric characteristics against a database is done
      to determine whether the applicant is already present in the database, possibly under a
      different name. The false positive identification rate (FPIR) refers to the proportion of 1:N
      searches in which a biometric system incorrectly identifies another person as a match, which
