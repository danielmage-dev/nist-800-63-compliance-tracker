  5.2-R1:
    id: 5.2-R1
    rev: 800-63a-r4
    sectionNumber: "5.2"
    ordinal: 1
    level: SHALL
    text: The CSP SHALL provide the capability for subscribers to authenticate and access information in
      their subscriber account.
    textHash: cdfaffac7ae0
    source: prose
    seededBy: parser
    verified: false
  5.2-R2:
    id: 5.2-R2
    rev: 800-63a-r4
    sectionNumber: "5.2"
    ordinal: 2
    level: SHALL
    text: For subscriber accounts that contain personal information, this capability SHALL be
      accomplished through AAL2 or AAL3 authentication processes using authenticators that are
      registered to the subscriber account.
    textHash: 0d4ff3bc86bc
    source: prose
    seededBy: parser
    verified: false
  5.3-R1:
    id: 5.3-R1
    rev: 800-63a-r4
    sectionNumber: "5.3"
    ordinal: 1
    level: SHALL
    text: The CSP SHALL provide the capability for a subscriber to request that information be updated
      in their subscriber account. The CSP MAY provide a mechanism for subscribers to directly
      update non-core attributes.
    textHash: e9b1dbef99b6
    source: prose
    seededBy: parser
    verified: false
  5.3-R2:
    id: 5.3-R2
    rev: 800-63a-r4
    sectionNumber: "5.3"
    ordinal: 2
    level: SHALL
    text: With the exception of physical addresses, the CSP SHALL validate any changes to core attribute
      information maintained in the subscriber account. The CSP SHOULD validate a change to the
      subscriber’s physical address if it is considered a core attribute by the CSP.
    textHash: 2136de6fea12
    source: prose
    seededBy: parser
    verified: false
  5.3-R3:
    id: 5.3-R3
    rev: 800-63a-r4
    sectionNumber: "5.3"
    ordinal: 3
    level: SHALL
    text: The CSP SHALL notify the subscriber of any updates made to information in the subscriber
      account.
    textHash: cd99e895ffdd
    source: prose
    seededBy: parser
    verified: false
  5.3-R4:
    id: 5.3-R4
    rev: 800-63a-r4
    sectionNumber: "5.3"
    ordinal: 4
    level: SHALL
    text: The CSP SHALL provide the capability for the subscriber to report any unauthorized access or
      potential compromise to information in their subscriber account.
    textHash: 95f5820608cf
    source: prose
    seededBy: parser
    verified: false
