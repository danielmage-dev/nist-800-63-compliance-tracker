chapter: "5"
rev: 800-63a-r4
requirements:
  5.1-R1:
    id: 5.1-R1
    rev: 800-63a-r4
    sectionNumber: "5.1"
    ordinal: 1
    level: SHALL
    text: The CSP SHALL establish and maintain a unique subscriber account for each active subscriber in
      its identity system from the time of enrollment to the time of account closure. The CSP
      establishes a subscriber account to record each subscriber as a unique identity within its
      identity service and to maintain a record of all authenticators associated with that account.
    textHash: 0afdd5c5aa07
    source: prose
    seededBy: parser
    verified: false
  5.1-R2:
    id: 5.1-R2
    rev: 800-63a-r4
    sectionNumber: "5.1"
    ordinal: 2
    level: SHALL
    text: The CSP SHALL assign a unique identifier to each subscriber account. The identifier SHOULD be
      randomly generated by the CSP’s system and of sufficient length and entropy to ensure
      uniqueness within its user population and to support federation with RPs, where applicable.
      The identifier MAY be used as a subject identifier in the generation of assertions, consistent
      with [SP800-63C].
    textHash: 64cdc7b219f8
    source: prose
    seededBy: parser
    verified: false
  5.1-R3:
    id: 5.1-R3
    rev: 800-63a-r4
    sectionNumber: "5.1"
    ordinal: 3
    level: SHALL
    text: The unique identifier associated with the subscriber account
    textHash: 5c26eb923724
    context: "At a minimum, the CSP SHALL include the following information in each subscriber account:"
    source: prose
    seededBy: parser
    verified: false
  5.1-R4:
    id: 5.1-R4
    rev: 800-63a-r4
    sectionNumber: "5.1"
    ordinal: 4
    level: SHALL
    text: Any subject identifiers established for the subscriber, including any RP-specific subject
      identifiers
    textHash: 6d4f8d4b0c66
    context: "At a minimum, the CSP SHALL include the following information in each subscriber account:"
    source: prose
    seededBy: parser
    verified: false
