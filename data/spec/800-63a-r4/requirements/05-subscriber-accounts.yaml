  5.4-R7:
    id: 5.4-R7
    rev: 800-63a-r4
    sectionNumber: "5.4"
    ordinal: 7
    level: SHALL
    text: The CSP ceases identity system and services operations.
    textHash: 9cf1413ff02c
    context: "The CSP SHALL promptly suspend or terminate the subscriber account when one of the
