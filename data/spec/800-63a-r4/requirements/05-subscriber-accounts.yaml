    source: prose
    seededBy: parser
    verified: false
  5.4-R8:
    id: 5.4-R8
    rev: 800-63a-r4
    sectionNumber: "5.4"
    ordinal: 8
    level: SHALL
    text: The CSP SHALL notify the subscriber if their account has been suspended or terminated. Such
      notices SHALL include information about why the account was suspended or terminated,
      reactivation or renewal options, and any options for redress if the subscriber thinks the
      account was suspended or terminated in error.
    textHash: db1541b63868
    source: prose
    seededBy: parser
    verified: false
  5.4-R9:
    id: 5.4-R9
    rev: 800-63a-r4
    sectionNumber: "5.4"
    ordinal: 9
    level: SHALL
    text: The CSP SHALL delete all personal information from the subscriber account records following
      account termination in accordance with the record retention and disposal requirements, as
      documented in its practices statement (see Sec. 3.1).
    textHash: 12b1df8fda0d
    source: prose
    seededBy: parser
    verified: false
  5.5-R1:
    id: 5.5-R1
    rev: 800-63a-r4
    sectionNumber: "5.5"
    ordinal: 1
    level: SHALL
    text: In the event of a data breach of CSP records, the CSP SHALL provide notification to
      subscribers whose personal information may have been exposed to unauthorized access. Such
      notification SHALL include information about the breach and actions for subscribers to take to
      recover or maintain access to their accounts and to protect against any unauthorized
      disclosure of their personal information. The CSP SHALL send such notifications as
      expeditiously as possible to the subscribers’ validated address.
    textHash: 2ea699db1e79
    source: prose
    seededBy: parser
    verified: false
  5.6-R1:
    id: 5.6-R1
    rev: 800-63a-r4
    sectionNumber: "5.6"
    ordinal: 1
    level: SHOULD
    text: Some CSPs need to support a single user’s ability to interact with the CSP while fulfilling
      different roles or personas. For example, a subscriber may interact as themselves and also as
      a representative of a business across different services supported by the CSP. Another
      scenario is a CSP that serves both commercial and federal RPs and must maintain a separation
      between its services. To limit fraud and avoid redundant costs and processes, CSPs SHOULD
      provide users with a means to manage multiple user personas without having to create multiple
      subscriber accounts. If this is not possible, and multiple subscriber accounts are supported
      for a single subscriber, the CSP SHOULD implement its subscriber accounts in a manner that
      avoids unnecessary re-proofing of the same subscriber (e.g., linking accounts via a common
      identifier or through biometric or attribute resolution).
    textHash: e5bed1619ac3
    source: prose
    seededBy: parser
    verified: false
  5.6-R2:
    id: 5.6-R2
    rev: 800-63a-r4
    sectionNumber: "5.6"
    ordinal: 2
    level: SHALL
    text: The CSP SHALL develop and document their process for reviewing and assessing subscribers with
      multiple accounts to identify possible fraud.
    textHash: 134edcf19300
    source: prose
    seededBy: parser
    verified: false
  5.6-R3:
    id: 5.6-R3
    rev: 800-63a-r4
    sectionNumber: "5.6"
    ordinal: 3
    level: SHALL
    text: The CSP SHALL maintain a mapping of all accounts associated with a unique government
      identifier or common core attributes.
    textHash: b791715d987b
    source: prose
    seededBy: parser
    verified: false
  5.6-R4:
    id: 5.6-R4
    rev: 800-63a-r4
    sectionNumber: "5.6"
    ordinal: 4
    level: SHALL
    text: The CSP SHALL provide individuals with visibility into the full list of subscriber accounts
      associated with their identity.
    textHash: 195cfa512222
    source: prose
    seededBy: parser
    verified: false
  5.6-R5:
    id: 5.6-R5
    rev: 800-63a-r4
    sectionNumber: "5.6"
    ordinal: 5
    level: SHOULD
    text: The CSP SHOULD allow subscribers to block the creation of additional accounts using their
      personal information.
    textHash: 4905efd3bd21
    source: prose
    seededBy: parser
