  5.4-R6:
    id: 5.4-R6
    rev: 800-63a-r4
    sectionNumber: "5.4"
    ordinal: 6
    level: SHALL
    text: The CSP receives a legal instrument instructing it to terminate a subscriber’s account.
    textHash: cc63c3c2430f
    context: "The CSP SHALL promptly suspend or terminate the subscriber account when one of the
