    sectionNumber: 4.1.1
    ordinal: 2
    level: SHALL
    text: CSPs MAY combine proofing types and their stated requirements to create hybrid processes. For
      example, a CSP might leverage remote unattended identity proofing validation processes in
      advance of a remote attended session where the verification will take place. If such steps are
      combined, CSPs SHALL document their hybrid process and state how the applicable requirements
      for each of the employed proofing types are met.
