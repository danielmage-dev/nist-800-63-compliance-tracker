chapter: "2"
rev: 800-63a-r4
requirements:
  2-R1:
    id: 2-R1
    rev: 800-63a-r4
    sectionNumber: "2"
    ordinal: 1
    level: SHOULD
    text: These guidelines provide multiple methods by which resolution, validation, and verification
      can be accomplished, as well as multiple types of identity evidence that support the identity
      proofing process. CSPs and organizations SHOULD provide options when implementing their
      identity proofing services and processes to promote access for applicants with different
      means, capabilities, and technologies. These options SHOULD include accepting multiple types
      and combinations of identity evidence, supporting multiple data validation sources, enabling
      multiple methods for verifying identity, providing multiple identity proofing types, and
      offering exception handling for applicants (e.g., trusted referees, applicant references).
    textHash: 224b11439eac
    source: prose
    seededBy: parser
    verified: false
  2-R2:
    id: 2-R2
    rev: 800-63a-r4
    sectionNumber: "2"
    ordinal: 2
    level: SHALL
    text: CSPs SHALL evaluate the risks associated with each identity proofing option offered (e.g.,
      identity proofing types, validation sources, assistance mechanisms) and implement mitigating
      fraud controls, as appropriate. At a minimum, CSPs SHALL design each option such that the
      options provide comparable assurance in aggregate.
    textHash: ed1e82011e90
    source: prose
    seededBy: parser
    verified: false
  2.1.2-R1:
    id: 2.1.2-R1
    rev: 800-63a-r4
    sectionNumber: 2.1.2
    ordinal: 1
    level: SHALL
    text: CSPs SHALL identify which of the above roles are applicable to their identity service and
      SHALL provide training and support resources consistent with the requirements and expectations
      provided in Sec. 3.
    textHash: aa74cf3719a2
    source: prose
    seededBy: parser
    verified: false
  2.1.3-R1:
    id: 2.1.3-R1
    rev: 800-63a-r4
    sectionNumber: 2.1.3
    ordinal: 1
    level: SHOULD
    text: The requirements at each assurance level are structured to allow CSPs to implement different
      combinations of identity proofing types to meet the requirements of different assurance
      levels, as appropriate. CSPs SHOULD offer the combination of identity proofing types that best
      addresses the needs of the populations served by their identity service and the risk posture
      of the RPs that use their service.
    textHash: 287ef2f3ab1f
    source: prose
    seededBy: parser
    verified: false
