    level: SHALL
    text: There is a reasonable expectation that the issuing source of the evidence confirmed the
      claimed identity by following formal procedures designed to provide assurance that the claimed
      identity is associated with the subject, such as evidence issued by financial institutions
      that have customer identity verification obligations under the Customer Identification Program
      (CIP) rule or procedures for establishing a mobile phone account with a mobile network
      operator (MNO).
