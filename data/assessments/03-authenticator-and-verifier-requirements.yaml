  3.2.2-R1:
    reqId: 3.2.2-R1
    status: partial
    notes: "Failed sign-ins are limited well below the 100-attempt ceiling (max_sign_in_failures: 5 per
      60s session-level, plus a sign_in_user_id_per_ip RateLimiter). What differs from the
      requirement is the remedy: the spec calls for *disabling* the authenticator and requiring
      rebinding per Sec. 4.1, whereas login.gov applies a time-boxed lockout that self-expires.
      Numerically stricter, structurally different — worth a human ruling."
    refs:
      - path: app/controllers/users/sessions_controller.rb
        startLine: 254
        endLine: 260
        snippet: "rate_limit_type: :sign_in_user_id_per_ip"
      - path: config/application.yml.default
        startLine: 360
        snippet: "max_sign_in_failures:"
      - path: app/services/rate_limiter.rb
        startLine: 216
        endLine: 226
        snippet: def self.load_rate_limit_config
    verified: false
    seededBy: claude
    updatedAt: 2026-08-10T14:24:32.244Z
