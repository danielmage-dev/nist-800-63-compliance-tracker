  3.1.1.2-R2:
    reqId: 3.1.1.2-R2
    status: compliant
    notes: Devise password_length upper bound is 128, well above the recommended 64-character minimum
      maximum.
    refs:
      - path: config/initializers/devise.rb
        startLine: 19
        snippet: config.password_length = 12..128
    verified: false
    seededBy: claude
    updatedAt: 2026-08-10T14:24:32.243Z
  3.1.1.2-R3:
    reqId: 3.1.1.2-R3
    status: compliant
    notes: No character-class restrictions are applied anywhere in password validation — only length and
      a zxcvbn strength score. ASCII printables and space are therefore accepted.
    refs:
      - path: app/validators/form_password_validator.rb
        startLine: 10
        endLine: 18
        snippet: validates :password,
    verified: false
    seededBy: claude
    updatedAt: 2026-08-10T14:24:32.244Z
  3.1.1.2-R4:
    reqId: 3.1.1.2-R4
    status: compliant
    notes: Rails' length validator counts Unicode characters (not bytes) on UTF-8 strings, so each code
      point counts as one character. No character filtering is applied.
    refs:
      - path: app/validators/form_password_validator.rb
        startLine: 12
        snippet: "length: { in: Devise.password_length }"
    verified: false
    seededBy: claude
    updatedAt: 2026-08-10T14:24:32.244Z
  3.1.1.2-R5:
    reqId: 3.1.1.2-R5
    status: compliant
    notes: No composition rules exist. Validation is length + zxcvbn score + breach/blocklist checks,
      none of which mandate character-type mixtures.
    refs:
      - path: app/validators/form_password_validator.rb
        startLine: 18
        snippet: validate :strong_password, :not_pwned, :passwords_match
    verified: false
    seededBy: claude
    updatedAt: 2026-08-10T14:24:32.244Z
  3.1.1.2-R6:
    reqId: 3.1.1.2-R6
    status: compliant
    notes: No periodic password expiration exists — no password_expiration setting in
      application.yml.default and no forced-rotation logic on User. Verify separately that a forced
      change occurs on evidence of compromise.
    refs: []
    verified: false
    seededBy: claude
    updatedAt: 2026-08-10T14:24:32.244Z
  3.1.1.2-R7:
    reqId: 3.1.1.2-R7
    status: compliant
    notes: No password-hint feature exists in the codebase; nothing stores or exposes a hint.
