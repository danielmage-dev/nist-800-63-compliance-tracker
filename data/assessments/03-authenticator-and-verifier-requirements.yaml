  3.1.1.2-R9:
    reqId: 3.1.1.2-R9
    status: compliant
    notes: The full submitted password is passed to scrypt; there is no truncation or subset-selection
      anywhere in the verification path.
    refs:
      - path: app/services/encryption/user_access_key.rb
        startLine: 80
        endLine: 83
        snippet: def build_scrypt_password(password, salt, cost)
    verified: false
    seededBy: claude
    updatedAt: 2026-08-10T14:24:32.244Z
  3.1.1.2-R10:
    reqId: 3.1.1.2-R10
    status: gap
    notes: No NFC (or any Unicode) normalization is applied before hashing. A password entered with
      decomposed characters on one endpoint will not verify against a composed-form hash. This is a
      SHOULD, but it is a real interoperability gap for non-ASCII passwords.
    refs:
      - path: app/validators/form_password_validator.rb
        startLine: 10
        endLine: 18
        snippet: validates :password,
    verified: false
    seededBy: claude
    updatedAt: 2026-08-10T14:24:32.244Z
  3.1.1.2-R11:
    reqId: 3.1.1.2-R11
    status: compliant
    notes: Breach-corpus check runs against the Pwned Passwords file via binary search over a sorted
      hash file.
