    status: partial
    notes: "HUMAN REVIEWED: accepted scrypt risk, migration tracked separately."
    refs:
      - path: app/services/encryption/user_access_key.rb
        startLine: 20
        endLine: 33
        snippet: cost ||= IdentityConfig.store.scrypt_cost
      - path: config/application.yml.default
        startLine: 476
        snippet: "scrypt_cost:"
    verified: true
