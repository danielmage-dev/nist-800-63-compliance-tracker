  3.1.1.2-R22:
    reqId: 3.1.1.2-R22
    status: compliant
    notes: scrypt generates a 128-bit per-password salt (far above the 32-bit floor), and as_scrypt_hash
      persists cost + salt + digest together, so the scheme parameters are recoverable for future
      migration.
    refs:
      - path: app/services/encryption/user_access_key.rb
        startLine: 36
        snippet: '"#{cost}#{salt}$#{z1}#{z2}"'
      - path: app/services/encryption/user_access_key.rb
        startLine: 80
        endLine: 83
        snippet: def build_scrypt_password(password, salt, cost)
    verified: false
    seededBy: claude
    updatedAt: 2026-08-10T14:24:32.244Z
  3.1.1.2-R23:
    reqId: 3.1.1.2-R23
    status: compliant
    notes: The stored verifier is not the bare scrypt output — a random R from SecureRandom is
      KMS-GCM-encrypted under a server secret and XORed with Z1, so an attacker with the database
      alone cannot brute force. The KMS key is held outside the database in a hardware-backed
      service, matching the "secret key stored separately" guidance.
    refs:
      - path: app/services/encryption/user_access_key.rb
        startLine: 4
        endLine: 12
        snippet: D = KMS_GCM_Encrypt(key=server_secret, plaintext=R) xor Z1
      - path: app/services/encryption/user_access_key.rb
        startLine: 38
        endLine: 45
        snippet: self.random_r = SecureRandom.random_bytes(32)
    verified: false
    seededBy: claude
    updatedAt: 2026-08-10T14:24:32.244Z
